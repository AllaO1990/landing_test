<div class="toolbar">
  <div class="toolbar__actions">
    <a
      *ngFor="let item of links; trackBy: trackByIndex"
      class="toolbar__link"
      #rla="routerLinkActive"
      routerLinkActive
      [routerLink]="item.path"
      mat-button
      [color]="rla.isActive ? 'primary' : ''"
    >
      {{ item.name }}
    </a>
    <button class="toolbar__actions-logout" mat-button (click)="logout()">Logout</button>
  </div>
</div>
