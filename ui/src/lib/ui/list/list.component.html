@if (list !== null) {
  <tui-scrollbar class="scrollbar">
    <cdk-virtual-scroll-viewport
      tuiScrollable
      class="viewport tui-zero-scrollbar"
      #viewport
      [itemSize]="itemSize">
      <ng-container
        *ngIf="header"
        [ngTemplateOutlet]="headerTemplate"
        [ngTemplateOutletContext]="{ viewport: viewport }">
      </ng-container>
      <ng-container
        *cdkVirtualFor="let item of list; templateCacheSize: templateCacheSize; trackBy: trackBy; template: template">
      </ng-container>
      <ng-container
        *ngIf="header"
        [ngTemplateOutlet]="footerTemplate"
        [ngTemplateOutletContext]="{ viewport: viewport }">
      </ng-container>
    </cdk-virtual-scroll-viewport>
  </tui-scrollbar>
} @else {
  <ui-loader class="loader"></ui-loader>
}

<ng-template #simple let-item>
  {{ item.id }}
</ng-template>

<ng-template #headerTemplate let-viewport="viewport">
  <div
    class="sticky"
    [style.top.px]="-viewport['_renderedContentOffset']">
    <ng-container *polymorpheusOutlet="header as text">{{ text }}</ng-container>
  </div>
</ng-template>

<ng-template #footerTemplate let-viewport="viewport">
  <div
    class="sticky"
    [style.bottom.px]="0">
    <ng-container *polymorpheusOutlet="footer as text">{{ text }}</ng-container>
  </div>
</ng-template>
