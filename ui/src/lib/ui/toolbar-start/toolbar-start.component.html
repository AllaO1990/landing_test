<div class="toolbar">
  <vt-toolbar-logo class="toolbar__logo"></vt-toolbar-logo>
  <div class="toolbar__actions">
    <a
      *ngFor="let item of links; trackBy: trackByIndex"
      class="toolbar__link"
      #rla="routerLinkActive"
      routerLinkActive
      [routerLink]="[{ outlets: { 'app-login': ['login'] } }]"
      mat-button
      [color]="rla.isActive ? 'primary' : null"
    >
      {{ item.name }}
    </a>
  </div>
</div>
