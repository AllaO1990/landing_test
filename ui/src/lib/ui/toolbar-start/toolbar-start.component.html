<div class="toolbar">
  <lib-logo class="toolbar__logo"></lib-logo>
  <div class="toolbar__actions">
    <a
      *ngFor="let item of links; trackBy: trackByIndex"
      class="toolbar__link"
      #rla="routerLinkActive"
      routerLinkActive
      [routerLink]="item.path"
      mat-button
      [color]="rla.isActive ? 'primary' : null">
      {{ item.name }}
    </a>
  </div>
</div>
