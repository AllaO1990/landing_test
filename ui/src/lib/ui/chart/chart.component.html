<highcharts-chart
  class="vt-highcharts"
  [Highcharts]="Highcharts"
  (chartInstance)="chartEvent($event)"
  [constructorType]="'stockChart'"
  [options]="chartOptions"
  (mousewheel)="onMouseWheel($event)"
  (touchmove)="onTouchMove($event)"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd()">
</highcharts-chart>
