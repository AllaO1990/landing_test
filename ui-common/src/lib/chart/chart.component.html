<tui-loader class="loader" [overlay]="true" [showLoader]="(candles$ | async) === null">
  <div class="container" *ngIf="(candles$ | async); else empty">
    <div class="column">
      <div class="charts">
        <vt-chart
          [consolidationZones]="zone$ | async"
          [data]="candles$ | async"
          [indicators]="indicators$ | async"
          [selected]="selected$ | async"
          [text]="text$ | async"
        ></vt-chart>
      </div>
      <div class="legend" *ngIf="toggleLegend">
        <lib-chart-legend class="chart-legend" [list]="(legend$ | async) || []"></lib-chart-legend>
      </div>
    </div>
    <div
      class="actions"
      [class.actions--hide]="!toggleActions">
      <button
        class="toggle-action"
        appearance="icon"
        tuiIconButton
        type="button"
        [icon]="toggleActions ? 'tuiIconChevronRight' : 'tuiIconChevronLeft'"
        size="xs"
        (click)="onToggleActions($event)">
      </button>

      <div class="actions__list">
        <lib-button-with-list
          class="action"
          [formControl]="controlEma"
          [icon]="emaIcon"
          [list]="emaList"
          (toggled)="onToggledEma()"
          (opened)="onOpenedEma($event)">
        </lib-button-with-list>

        <lib-button-with-list
          class="action"
          [formControl]="controlSma"
          [icon]="smaIcon"
          [list]="smaList"
          (toggled)="onToggledSma()"
          (opened)="onOpenedSma($event)">
        </lib-button-with-list>

        <button
          class="action"
          [appearance]="controlAtr.value ? 'primary' : 'secondary'"
          tuiIconButton
          type="button"
          [icon]="atrIcon"
          size="l"
          (click)="onToggleAtr($event)">
        </button>

        <lib-button-with-list
          class="action"
          [formControl]="controlZone"
          [icon]="consolidationIcon"
          [list]="zoneList"
          (toggled)="onToggledZone()"
          (opened)="onOpenedZone($event)">
        </lib-button-with-list>

        <div class="space"></div>

        <button
          class="action"
          [appearance]="toggleLegend ? 'primary' : 'secondary'"
          tuiIconButton
          type="button"
          icon="tuiIconLink"
          size="l"
          (click)="onToggleLegend($event)">
        </button>
      </div>

    </div>
  </div>
</tui-loader>

<ng-template #emaIcon>
  <svg viewBox="0 0 16 16" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg" class="t-svg">
    <text text-anchor="middle" x="50%" y="10px" fill="currentColor" style="font-size: 6px">EMA</text>
  </svg>
</ng-template>

<ng-template #smaIcon>
  <svg viewBox="0 0 16 16" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg" class="t-svg">
    <text text-anchor="middle" x="50%" y="10px" fill="currentColor" style="font-size: 6px">SMA</text>
  </svg>
</ng-template>

<ng-template #atrIcon>
  <svg viewBox="0 0 16 16" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg" class="t-svg">
    <text text-anchor="middle" x="50%" y="10px" fill="currentColor" style="font-size: 6px">ATR</text>
  </svg>
</ng-template>

<ng-template #consolidationIcon>
  <svg viewBox="0 0 16 16" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg" class="t-svg">
    <text text-anchor="middle" x="50%" y="10px" fill="currentColor" style="font-size: 6px">Zone</text>
  </svg>
</ng-template>

<ng-template #empty>
  <div class="empty">Загрузка...</div>
</ng-template>
