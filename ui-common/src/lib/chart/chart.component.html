<div
  class="container"
  [class.container--update]="isUpdate$ | async">
  <div class="column">
    @if (candles$ | async; as data) {
      <div class="charts">
        <vt-chart
          (event)="onEvent($event)"
          [data]="data"
          [indicators]="indicators$ | async"
          [zones]="zone$ | async"
          [figure]="figures$ | async"
          [text]="text$ | async"
        ></vt-chart>
      </div>
    } @else {
      <ui-loader class="loader"></ui-loader>
    }

    @if (toggleLegend) {
      <div class="legend">
        <lib-chart-legend class="chart-legend" [list]="(legend$ | async) || []"></lib-chart-legend>
      </div>
    }
  </div>
  <div
    class="actions"
    [class.actions--hide]="!toggleActions">
    <div class="actions__toggle">
      <button
        class="toggle-action"
        appearance="icon"
        tuiIconButton
        type="button"
        [iconStart]="toggleActions ? '@tui.chevron-right' : '@tui.chevron-left'"
        size="xs"
        (click)="onToggleActions($event)">
      </button>
    </div>

    <div class="actions__list">
      <lib-button-with-list
        class="action"
        [formControl]="controlEma"
        [valueMatcher]="valueMatcherEma"
        [icon]="emaIcon"
        [list]="emaList">
      </lib-button-with-list>

      <lib-button-with-list
        class="action"
        [formControl]="controlSma"
        [valueMatcher]="valueMatcherEma"
        [icon]="smaIcon"
        [list]="smaList">
      </lib-button-with-list>

      <lib-button-with-list
        class="action"
        [formControl]="controlZone"
        [valueMatcher]="valueMatcherEma"
        [icon]="zoneIcon"
        [list]="zoneList"
        (toggled)="onToggledZone()"
        (opened)="onOpenedZone($event)">
      </lib-button-with-list>

      <button
        class="action"
        [appearance]="controlAtr.value ? 'primary' : 'secondary'"
        tuiButton
        type="button"
        [iconStart]="artIcon"
        [size]="size"
        (click)="onToggleAtr($event)">
      </button>

      <button
        class="action"
        [appearance]="controlTarget.value ? 'primary' : 'secondary'"
        tuiButton
        type="button"
        [iconStart]="ideaIcon"
        [size]="size"
        (click)="onToggleTarget($event)">
      </button>

      <div class="space"></div>

      <button
        class="action"
        [appearance]="toggleLegend ? 'primary' : 'secondary'"
        [disabled]="(isDisabledButtonLegend$ | async) || false"
        tuiButton
        type="button"
        iconStart="@tui.table-of-contents"
        [size]="size"
        (click)="onToggleLegend($event)">
      </button>
    </div>
  </div>
</div>

@if (isUpdate$ | async) {
  <div class="update">
    <ui-loader class="loader"></ui-loader>
  </div>
}

<ng-template #empty>
  <div class="empty">Загрузка...</div>
</ng-template>
