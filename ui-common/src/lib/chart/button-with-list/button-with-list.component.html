<!-- Taiga migration TODO: tuiButton "whiteblock-active" appearance is no longer available. Use 'appearance="outline-grayscale" tuiAppearanceMode="checked"' -->
<div
  tuiGroup
  [collapsed]="true">
  <button
    [appearance]="appearance"
    tuiIconButton
    type="button"
    [iconStart]="icon"
    size="l"
    (click)="onToggle($event)"
    [disabled]="disabled">
  </button>
  <!-- Taiga migration TODO: contentTop and contentBottom inputs has been removed. Use ng-content, see taiga-ui.dev/components/badged-content  -->
<tui-badged-content
   
    [style.--tui-radius.%]="50">
    <button
      [appearance]="appearance"
      tuiIconButton
      size="l"
      type="button"
      [disabled]="disabled"
      [iconStart]="controlOpen ? '@tui.chevron-up' : '@tui.chevron-down'"
      [tuiDropdown]="content"
      [tuiDropdownManual]="controlOpen"
      [tuiDropdownAlign]="'right'"
      [tuiDropdownOffset]="8"
      (click)="onOpenMore()"
      (tuiActiveZoneChange)="onActiveZoneMore($event)"
      (tuiObscured)="onObscuredMore($event)">
    </button>
  </tui-badged-content>
</div>

<ng-template #content>
  <tui-data-list size="s">
    <tui-opt-group
      tuiMultiSelectGroup
      [formControl]="control">
      <button
        *ngFor="let item of list"
        tuiOption
        [disabled]="item.disabled"
        [value]="item">
        {{ item.name }}
      </button>
    </tui-opt-group>
  </tui-data-list>
</ng-template>
