<div
  tuiGroup
  [collapsed]="true">
  <button
    [appearance]="appearance"
    tuiIconButton
    type="button"
    [iconStart]="icon"
    size="l"
    (click)="onToggle($event)"
    [tuiAppearanceState]="disabled | isDisabledState">
  </button>
  <tui-badged-content>
    <tui-badge
      appearance="primary"
      size="s"
      tuiSlot="top">
      {{ length$ | async }}
    </tui-badge>
    <button
      [appearance]="appearance"
      tuiIconButton
      size="l"
      type="button"
      [disabled]="disabled"
      [iconStart]="controlOpen ? '@tui.chevron-up' : '@tui.chevron-down'"
      [tuiDropdown]="content"
      [tuiDropdownManual]="controlOpen"
      [tuiDropdownAlign]="'right'"
      [tuiDropdownOffset]="8"
      (click)="onOpenMore()"
      (tuiActiveZoneChange)="onActiveZoneMore($event)"
      (tuiObscured)="onObscuredMore($event)">
    </button>
  </tui-badged-content>
</div>

<ng-template #content>
  <tui-data-list size="s">
    <tui-opt-group
      tuiMultiSelectGroup
      [formControl]="control">
      <button
        *ngFor="let item of list"
        tuiOption
        [disabled]="item.disabled"
        [value]="item">
        {{ item.name }}
      </button>
    </tui-opt-group>
  </tui-data-list>
</ng-template>
