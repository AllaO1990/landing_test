<form tuiGroup class="form" [formGroup]="form" (ngSubmit)="onSearch($event)">
  <tui-input
    tuiAutoFocus
    formControlName="search"
    [tuiTextfieldSize]="size"
    [tuiTextfieldCleaner]="true"
    [tuiTextfieldLabelOutside]="true">
    Введите название тикера
    <input tuiTextfieldLegacy autocomplete="off" />
  </tui-input>
  <button
    class="search"
    appearance="primary"
    tuiButton
    [size]="size"
    [disabled]="controlSearch.value && controlSearch.value.length === 0"
    type="submit"
  >Найти
  </button>
  <button
    class="close"
    appearance="outline"
    tuiButton
    [size]="size"
    type="button"
    (click)="onClose($event)"
  >Закрыть
  </button>
</form>
<div class="list">
  <div
    class="empty"
    *ngIf="isEmpty$ | async">
    Ничего не найдено
  </div>
  <lib-list
    class="viewport"
    [list]="list$ | async"
    [header]="headerTemplate"
    [itemSize]="40">
    <div class="item row" *libListItem="let item" (click)="onClick($event, item)">
      <div class="cell item__ticker">
        <div class="item__img">
          <ui-icon-ticker [instrument]="item"></ui-icon-ticker>
        </div>
        <div class="item__column item__description">
          <div class="item__title ellipsis" [title]="item.ticker">
            {{ item.ticker }}
          </div>
          <div class="item__subtitle ellipsis" [title]="item.name">
            {{ item.name }}
          </div>
        </div>
      </div>
      <div class="cell item__sector ellipsis" [title]="item.sector">
        {{ item.sector }}
      </div>
      <div class="cell item__exchange">{{ item.realExchange }}</div>
    </div>
  </lib-list>
</div>
<div class="actions" *ngIf="length$ | async as length">
  <ui-loader
    class="loader"
    *ngIf="isLoad$ | async" />
  <tui-pagination
    class="pagination"
    [index]="index"
    [length]="length"
    (indexChange)="goToPage($event)"
  />
</div>

<ng-template #headerTemplate>
  <lib-list-header class="header">
    <div class="cell">Тикер</div>
    <div class="cell">Сектор</div>
    <div class="cell">Биржа</div>
  </lib-list-header>
</ng-template>
