<div class="search-dialog">
  <form tuiGroup class="search-dialog__form form" [formGroup]="form" (ngSubmit)="onSearch($event)">
    <tui-input
      tuiAutoFocus
      formControlName="search"
      [tuiTextfieldSize]="size"
      [tuiTextfieldCleaner]="true"
      [tuiTextfieldLabelOutside]="true">
      Введите название тикера
      <input tuiTextfieldLegacy autocomplete="off" />
    </tui-input>
    <button
      class="search"
      appearance="primary"
      tuiButton
      [size]="size"
      [disabled]="isDisabledSearch$ | async"
      type="submit"
    >Найти
    </button>
    <button
      class="close"
      appearance="outline"
      tuiButton
      [size]="size"
      type="button"
      (click)="onClose($event)"
    >Закрыть
    </button>
  </form>

  <div class="search-dialog__container">
    <div class="search-dialog__list list" *ngIf="list$ | async as list; else loader">
      <div
        class="empty"
        *ngIf="list.total === 0">
        Ничего не найдено
      </div>

      <lib-list
        class="viewport"
        [list]="list.total === 0 ? [] : list.items"
        [trackBy]="trackById"
        [header]="headerTemplate"
        [itemSize]="40">
        <div
          class="item row"
          [class.unsubscription]="!item.inSub"
          *libListItem="let item"
          (click)="onClick($event, item)">
          <div class="cell item__ticker">
            <div class="item__img">
              <ui-icon-ticker [instrument]="item"></ui-icon-ticker>
            </div>
            <div class="item__column item__description">
              <div class="item__title ellipsis" [title]="item.ticker">
                {{ item.ticker }}
              </div>
              <div class="item__subtitle ellipsis" [title]="item.name">
                {{ item.name }}
              </div>
            </div>
          </div>
          <div class="cell item__sector ellipsis" [title]="item.sector">
            {{ item.sector }}
          </div>
          <div class="cell item__exchange">{{ item.realExchange }}</div>
        </div>
      </lib-list>

      <div class="actions">
        <tui-pagination
          *ngIf="(list.total | searchDialogListLength: 100) as length"
          class="pagination"
          [index]="index"
          [length]="length"
          (indexChange)="goToPage($event)"
        />
      </div>
    </div>
  </div>
</div>

<ng-template #headerTemplate>
  <lib-list-header class="header">
    <div class="cell">Тикер</div>
    <div class="cell">Сектор</div>
    <div class="cell">Биржа</div>
  </lib-list-header>
</ng-template>

<ng-template #loader>
  <ui-loader class="loader"></ui-loader>
</ng-template>
