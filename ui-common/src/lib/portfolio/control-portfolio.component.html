@if (list$ | async; as list) {
  <div class="portfolio" [formGroup]="form">
    @if (!isAdd) {
      <div class="portfolio__container">
        <tui-textfield
          class="portfolio__control"
          tuiChevron
          [identityMatcher]="identityMatcherPortfolio()"
          [stringify]="stringifyPortfolio()"
          [tuiTextfieldSize]="size"
          tuiDropdownLimitWidth="auto"
          [tuiTextfieldCleaner]="false">
          <input
            formControlName="portfolio"
            [placeholder]="'Портфель'"
            autocomplete="off"
            tuiSelect/>
          <tui-data-list-wrapper
            *tuiTextfieldDropdown
            new
            [items]="list"
            [itemContent]="content"
          />
        </tui-textfield>
        <button
          class="portfolio__action"
          [size]="size"
          [disabled]="isDisabled"
          iconStart="@tui.plus"
          tuiIconButton
          appearance="secondary"
          type="button"
          (click)="onAdd($event)">
        </button>
      </div>
    } @else {
      <lib-input-with-actions
        class="portfolio__control"
        [size]="size"
        [placeholder]="'Название портфеля'"
        [stringify]="stringify"
        [value]="controlAdd.value"
        (formEvent)="onFormEvent($event)">
      </lib-input-with-actions>
    }
  </div>
} @else {
  <ui-loader></ui-loader>
}

<ng-template #content let-item>
  <div class="item">
    <div class="item__text">
      {{ item.portfolio }}
    </div>
    <div class="item__space"></div>
    <div class="item__actions">
      <button
        class="item__edit"
        [size]="size"
        iconStart="@tui.pencil"
        tuiIconButton
        appearance="icon"
        type="button"
        (click)="onEdit($event, item)">
      </button>
      <button
        class="item__remove"
        [size]="size"
        iconStart="@tui.trash-2"
        tuiIconButton
        appearance="icon"
        type="button"
        (click)="onRemove($event, item)">
      </button>
    </div>
  </div>
</ng-template>

<ng-template #templateDelete let-data>
  <div class="dialog">
    <div class="dialog__title">
      <h3>Удалить портфель: {{ data.name }}?</h3>
    </div>
    <div class="dialog__content">
      Все транзакции связанные с портфелем "{{ data.name }}" будут удалены.
    </div>
  </div>
</ng-template>
