<tui-tabs
  class="tabs"
  [activeItemIndex]="activeItemIndex"
  (activeItemIndexChange)="onChange($event)">
  <button
    *ngFor="let item of tabs; trackBy: trackByIndex; index as i"
    class="tab"
    [title]="item.title ? item.title : item.text"
    [class.tab--active]="i === activeItemIndex"
    tuiTab>
    <tui-icon  class="tab__icon" [icon]="item.icon"></tui-icon>
    <span class="tab__text">
      {{ item.text }}
    </span>
  </button>
</tui-tabs>
