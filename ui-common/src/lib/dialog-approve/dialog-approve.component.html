<div class="dialog">
  <ng-container
    [ngTemplateOutlet]="data && data.template || defaultTemplate"
    [ngTemplateOutletContext]="{ $implicit: data && data.context }"
  ></ng-container>
  <div class="dialog__actions">
    <button
      tuiAutoFocus
      class="dialog__action"
      [size]="size"
      tuiButton
      type="submit"
      (click)="submit($event)">
      Да
    </button>
    <button
      class="dialog__action"
      appearance="secondary"
      [size]="size"
      tuiButton
      type="button"
      (click)="cancel($event)">
      Нет
    </button>
  </div>
</div>

<ng-template #defaultTemplate let-data>
  @if (data) {
    <div class="dialog__content" [innerHTML]="data">
    </div>
  } @else {
    <div class="dialog__content">
      Вы уверены, что хотите удалить?
    </div>
  }
</ng-template>
