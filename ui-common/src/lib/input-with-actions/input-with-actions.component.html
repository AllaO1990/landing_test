<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <tui-textfield
    class="form__input"
    tuiAutoFocus
    [tuiTextfieldSize]="size"
    [tuiTextfieldCleaner]="true">
    <input
      [placeholder]="placeholder"
      tuiTextfield
      formControlName="name"
      autocomplete="off"
    />
  </tui-textfield>
  <button
    class="form__action form__submit"
    [size]="size"
    iconStart="@tui.check"
    tuiIconButton
    [disabled]="form.invalid"
    type="submit">
  </button>
  <button
    class="form__action form__cancel"
    [size]="size"
    tuiIconButton
    type="button"
    iconStart="@tui.x"
    appearance="secondary"
    (click)="onCancel($event)">
  </button>
</form>
