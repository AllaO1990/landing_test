<div class="banner">
  <div class="banner__description description">
    <div class="description__title">
      <h1><span>Биржевые идеи,</span> которые зарабатывают</h1>
    </div>
    <div class="description__content">
      Генерируем биржевые прогнозы на основе математических моделей и искусственного интеллекта, чтобы вы тратили время
      на себя, а не на бесконечный анализ цифр <strong>36,8%</strong> средняя годовая доходность GrinTrade за вычетом
      комиссий брокера подробнее.
    </div>
    <div class="description__action">
      <button
        size="m"
        tuiButton
        [disabled]="true">
        <tui-icon icon="@tui.square-arrow-up-right"/>
        Попробовать бесплатно
      </button>
    </div>
  </div>
  <div class="banner__image image">
    <img alt="Биржевые сделки доступны каждому" src="/assets/images/promo.webp">
  </div>
</div>
