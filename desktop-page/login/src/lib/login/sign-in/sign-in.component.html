<form class="form" [formGroup]="formGroup" (ngSubmit)="onSubmit($event)">
  <div class="form__title">Войти по email</div>
  <ng-container [ngTemplateOutlet]="formType() === 'email' ? email : code"></ng-container>
</form>

<ng-template #email>
  <div class="form__container" [formGroup]="formGroup">
    @if (isLoad()) {
      <ui-loader size="l" class="loader"></ui-loader>
    }
    <label class="form__control control">
      <span class="control__text">Введите email</span>
      <tui-textfield
        @opacityAnimations
        [tuiTextfieldSize]="size"
        iconStart="@tui.mail">
        <input
          placeholder="my@my.com"
          tuiTextfield
          formControlName="email"
        />
      </tui-textfield>
    </label>
    <button
      class="form__action"
      [size]="size"
      [disabled]="controlEmail.invalid || !controlAgree.value"
      tuiButton
      type="submit">
      Войти
    </button>
  </div>
</ng-template>

<ng-template #code>
  <div class="form__container" [formGroup]="formGroup">
    @if (isLoad()) {
      <ui-loader size="l" class="loader"></ui-loader>
    }
    <label class="form__control control">
      <span class="control__text">Введите пароль/код из Telegram</span>
      <tui-textfield
        @opacityAnimations
        [tuiTextfieldSize]="size"
        iconStart="@tui.key-round">
        <input
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="Telegram code"
          tuiTextfield
          formControlName="code"
        />
      </tui-textfield>
    </label>
    <button
      class="form__action"
      [size]="size"
      [disabled]="controlCode.invalid || !controlAgree.value"
      tuiButton
      type="submit">
      Войти
    </button>
  </div>
</ng-template>

<p class="form__information">Нет учетной записи?
  <a tuiLink iconEnd="@tui.arrow-right"
     [routerLink]="['../sign-up']" [queryParams]="{ email: controlEmail.value }">Зарегистрироваться</a>
</p>

<label tuiBlock [formGroup]="formGroup" class="form__information">
  <input
    size="s"
    formControlName="agree"
    tuiCheckbox
    name="agree"
    type="checkbox"
    value="watermelons"
  />
  <span>
    Нажимая на кнопку Войти, я даю свое
    <a tuiLink target="_blank" href="/assets/docs/consent-to-the-processing-of-personal-data.pdf">согласие на обработку персональных данных</a> в соответствии с
    <a tuiLink target="_blank" href="/assets/docs/personal-data-processing-policy.pdf">Политикой обработки персональных данных</a> и соглашаюсь с условиями
    <a tuiLink target="_blank" href="/assets/docs/offer-agreement.pdf">Пользовательсткого соглашения</a>
  </span>
</label>
