<div class="form">
  <div class="form__title">
    Зарегистрироваться
  </div>
  @if (isLoad()) {
    <ui-loader size="l" class="loader"></ui-loader>
  }
  @if (email() === null) {
    <login-form-email
      [agree]="true"
      (changed)="onChangeEmail($event)"></login-form-email>
  } @else {
    <login-form-tg-code
      [email]="email()"
      (changed)="onChangeCode($event)"
    ></login-form-tg-code>
  }
</div>

<p class="form__information">Есть учетная запись?
  <a tuiLink iconEnd="@tui.arrow-right" [routerLink]="['../sign-in']" [queryParams]="params$ | async">Войти</a>
</p>
