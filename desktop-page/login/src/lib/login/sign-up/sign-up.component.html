<form class="form" [formGroup]="formGroup" (ngSubmit)="onSubmit($event)">
  <div class="form__title">Зарегистрироваться</div>
  <div class="form__container" [formGroup]="formGroup">
    @if (isLoad()) {
      <ui-loader size="l" class="loader"></ui-loader>
    }
    <label class="form__control control">
      <span class="control__text">Введите email</span>
      <tui-textfield
        @opacityAnimations
        [tuiTextfieldSize]="size"
        iconStart="@tui.mail">
        <input
          placeholder="my@my.com"
          tuiTextfield
          formControlName="email"
        />
      </tui-textfield>
    </label>
    <button
      class="form__action"
      [size]="size"
      [disabled]="controlEmail.invalid"
      tuiButton
      type="submit">
      Получить код
    </button>
  </div>
</form>

<p class="form__information">Есть учетная запись?
  <a tuiLink iconEnd="@tui.arrow-right" [routerLink]="['../sign-in']">Войти</a>
</p>
