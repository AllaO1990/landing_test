<mat-card class="gpn-auth-card">
  <mat-card-header>
    <mat-card-title>Введите код авторизации</mat-card-title>
  </mat-card-header>
  <form action="">
    <mat-card-content class="gpn-auth-card-content">
      <mat-form-field class="example-full-width">
        <input
          matInput
          placeholder="Введите код"
          type="text"
          autofocus
          mask="00000"
          [showMaskTyped]="true"
          [formControl]="keyFormControl"
        />
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button
        mat-flat-button
        color="primary"
        [disabled]="!keyFormControl.valid"
        (click)="login()"
        type="submit"
      >
        Подтвердить
      </button>
    </mat-card-actions>
  </form>
</mat-card>
