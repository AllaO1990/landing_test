<form class="form" [formGroup]="formGroup">
  <tui-scrollbar class="form__filter">
    <div class="form__label">
      <span>{{ constants.type }}</span>
      <tui-textfield
        class="form__control"
        tuiChevron
        [identityMatcher]="identityMatcherOrderType()"
        [stringify]="stringifyOrderType()"
        [tuiTextfieldSize]="size"
        [tuiTextfieldCleaner]="false">
        <input
          formControlName="type"
          placeholder="Тип заявки"
          autocomplete="off"
          tuiSelect />
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="types$ | async"
        />
      </tui-textfield>
    </div>
    <div class="form__label">
      <span>{{ constants.strategy }}</span>
      <tui-textfield
        class="form__control"
        tuiChevron
        [identityMatcher]="identityMatcherStrategy()"
        [stringify]="stringifyStrategy()"
        [tuiTextfieldSize]="size"
        [tuiTextfieldCleaner]="false">
        <input
          formControlName="strategy"
          placeholder="Стратегия"
          autocomplete="off"
          tuiSelect />
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="strategy$ | async"
        />
      </tui-textfield>
    </div>
    <div class="form__label">
      <span>{{ constants.currency }}</span>
      <tui-textfield
        class="form__control"
        tuiChevron
        [identityMatcher]="identityMatcherCurrency()"
        [stringify]="stringifyCurrency()"
        [tuiTextfieldSize]="size"
        [tuiTextfieldCleaner]="false">
        <input
          formControlName="currency"
          placeholder="Валюта"
          autocomplete="off"
          tuiSelect />
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="currency$ | async"
        />
      </tui-textfield>
    </div>
  </tui-scrollbar>
</form>
