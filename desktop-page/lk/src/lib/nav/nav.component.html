<!-- Taiga migration TODO: tuiButton "whiteblock-active" appearance is no longer available. Use 'appearance="outline-grayscale" tuiAppearanceMode="checked"' -->
<tui-items-with-more
  tuiGroup
  [collapsed]="true">
  <ng-container *ngFor="let item of (links$ | async); trackBy: trackByIndex">
    <a
      *tuiItem
      [routerLink]="$any(item.disabled ? null : item.path)"
      [queryParams]="item.params"
      routerLinkActive
      #rla="routerLinkActive"
      [appearance]="rla.isActive ? 'secondary' : 'whiteblock'"
      size="m"
      tuiButton
      [tuiAppearanceState]="item.disabled ? 'disabled' : 'active'"
      [iconStart]="item.icon"
      type="button">
      {{ item.name }}
    </a>
  </ng-container>
  <button
    *tuiItem
    appearance="whiteblock"
    size="m"
    tuiIconButton
    iconStart="@tui.log-out"
    type="button"
    (click)="logout()">
  </button>

  <ng-template
    let-lastIndex
    tuiMore>

    <div tuiDropdownOpen
         tuiDropdownAlign="right"
         class="item"
         #dropdownHost
         [tuiDropdown]="dropdown">

      <button
        iconStart="@tui.ellipsis-vertical"
        tuiIconButton
        type="button"
        appearance="whiteblock"
        size="m">
      </button>

      <ng-template #dropdown>
        <tui-data-list role="menu" size="m">
          <tui-opt-group>
            <ng-container
              *ngFor="let item of (links$ | async); let index = index; trackBy: trackByIndex">
              <!--              <a-->
              <!--                tuiOption-->
              <!--                (click)="onCloseDropDown($event, item, dropdownHost)"-->
              <!--                class="link-option"-->
              <!--                [class.link-option&#45;&#45;disabled]="item.disabled"-->
              <!--                *ngIf="index > lastIndex"-->
              <!--                [routerLink]="$any(item.disabled ? null : item.path)"-->
              <!--                routerLinkActive-->
              <!--                #rla="routerLinkActive"-->
              <!--                [attr.aria-checked]="rla.isActive">-->
              <!--                <tui-icon [icon]="item.icon"></tui-icon>-->
              <!--                {{ item.name }}-->
              <!--              </a>-->
            </ng-container>
            <a
              tuiOption
              class="link-option"
              (click)="logout()">
              <tui-icon icon="@tui.log-out"></tui-icon>
              Выход
            </a>
          </tui-opt-group>
        </tui-data-list>
      </ng-template>
    </div>
  </ng-template>
</tui-items-with-more>
