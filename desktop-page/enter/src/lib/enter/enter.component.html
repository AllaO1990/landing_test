<div
  class="container container--{{breakpoint$ | async}} container--{{orientation$ | async}}">
  <div class="container__toolbar">
    <div class="container__actions">
      <ng-container *ngIf="(data$ | async) as result; else load">
        <lib-instrument
          [data]="result.idea.instrument">
        </lib-instrument>
        <div class="date-start" *ngIf="result.idea.createdAt">
          Идея от
          <span>{{ result.idea.createdAt | date : 'dd.MM.yyyy' }}</span>
        </div>
        @if (result.idea.author === 'bot') {
          <img
            class="idea__icon"
            src="/assets/icons/vanya.svg"
            alt="Идея"
          />
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        }
        <div class="space"></div>
        <button
          class="action bell"
          tuiButton
          appearance="primary"
          libEnterSubscribe
          [loading]="controlWatch.value === null"
          [isSubscribe]="controlWatch.value"
          (isSubscribeChanged)="onSubscribe($event)"
          [ideaId]="result.idea.id"
          [size]="size"
          [disabled]="controlWatch.value === null"
          type="button"
          [iconStart]="controlWatch.value ? '@tui.bell' : '@tui.bell-off'">
          {{ controlWatch.value ? 'Отслеживается' : 'Не отслеживается' }}
        </button>
        <button
          class="action"
          tuiIconButton
          appearance="outline"
          [size]="size"
          [disabled]="(isShowSearch$ | async)"
          (click)="onDelete($event, result.idea.id)"
          type="button"
          iconStart="@tui.trash"
        ></button>
        <button
          class="action save"
          tuiIconButton
          [appearance]="form.pristine || (isDisabled$ | async) ? 'outline' : 'primary'"
          [size]="size"
          [disabled]="form.pristine || (isDisabled$ | async)"
          [loading]="isLoading$ | async"
          (click)="onSubmit($event, result.idea.id)"
          type="button"
          iconStart="@tui.save"
        ></button>
        <button
          *ngIf="isShowSearch$ | async"
          class="search"
          tuiIconButton
          appearance="outline"
          [size]="size"
          [disabled]="false"
          type="button"
          searchDialog
          #dialog=SearchDialog
          (click)="dialog.onSearch($event)"
          (selected)="onSearch($event)"
          iconStart="@tui.search"
        ></button>
      </ng-container>
      <button
        style="margin-left: var(--padding-4)"
        appearance="icon"
        iconStart="@tui.x"
        tuiIconButton
        [size]="size"
        type="button"
        (click)="onClose($event)"
      ></button>
    </div>
  </div>
  <div
    [style.margin-left.%]="activeItemIndex * -100"
    class="container__widget-list">
    <div class="container__sidebar container__widget">
      <lib-enter-sidebar
        *ngIf="(data$ | async) as result; else load"
        [formGroup]="form"
        [formControl]="controlSidebar">
      </lib-enter-sidebar>
    </div>
    <div class="container__chart container__widget">
      <div class="widget">
        <lib-chart></lib-chart>
      </div>
    </div>
    <div class="container__idea container__widget">
      <div class="widget">
        <tui-notification appearance="negative" *ngIf="maxAmount$ | async" @heightAnimations>
          Количество в целях не должно превышать количество входа в идее
        </tui-notification>
        <tui-notification appearance="positive" *ngIf="isShowCopyNotify$ | async" @heightAnimations>
          Идея бота скопирована
        </tui-notification>
        <div class="widget__header">
          <div class="header">
            <button
              *ngIf="isCanCopy$ | async"
              class="header__action header__action--left"
              tuiButton
              appearance="flat"
              tuiHint="Скопируйте идею для создания новой с возможностью редактирования"
              tuiHintAppearance="dark"
              size="xs"
              type="button"
              (click)="onCopy($event)"
              iconStart="@tui.copy">
              Скопировать идею
            </button>
            Идея
          </div>
        </div>
        <div class="widget__content">
          <tui-scrollbar class="scrollbar" [hidden]="true">
            <lib-enter-idea
              *ngIf="(data$ | async) as result; else load"
              [formGroup]="form"
              [formControl]="controlIdea"
              class="tui-zero-scrollbar">
            </lib-enter-idea>
          </tui-scrollbar>
        </div>
      </div>
    </div>
    <div class="container__action container__widget">
      <div class="widget">
        <div class="header widget__header">
          Сделка
          <button
            class="header__action header__action--right"
            tuiButton
            appearance="secondary"
            size="xs"
            type="button"
            [disabled]="isDisableTrade$ | async"
            (click)="onTrade($event)"
            iconStart="@tui.chart-candlestick">
            Брокерские заявки
          </button>
        </div>
        <div class="widget__content">
          <tui-scrollbar class="scrollbar" [hidden]="true">
            <lib-enter-action
              *ngIf="(data$ | async) as result; else load"
              [formGroup]="form"
              [formControl]="controlActions"
              class="tui-zero-scrollbar">
            </lib-enter-action>
          </tui-scrollbar>
        </div>
      </div>
    </div>
  </div>
  <div class="container__tabs" *ngIf="(tabs$ | async) as tabs">
    <tui-tabs
      class="tabs"
      [(activeItemIndex)]="activeItemIndex">
      <button
        *ngFor="let item of tabs; trackBy: trackByIndex; index as i"
        class="tab"
        [class.tab--active]="i === activeItemIndex"
        tuiTab>
        <tui-icon
          class="tab__icon"
          [icon]="item.icon"
        ></tui-icon>
        <span class="tab__text">
            {{ item.text }}
          </span>
      </button>
    </tui-tabs>
  </div>
</div>

<ng-template #load>
  <ui-loader style="width: 100%;"></ui-loader>
</ng-template>
