<div
  class="container container--{{breakpoint$ | async}} container--{{orientation$ | async}}">
  <div class="container__toolbar">
    <div class="container__actions">
      <ng-container *ngIf="(data$ | async) as result; else load">
        <button
          class="action"
          tuiIconButton
          appearance="outline"
          [size]="size"
          [disabled]="(isShowSearch$ | async)"
          (click)="onDelete($event, result.idea.id)"
          type="button"
          iconStart="@tui.trash"
        ></button>
        <button
          class="action save"
          tuiIconButton
          [appearance]="form.pristine || (isDisabled$ | async) ? 'outline' : 'primary'"
          [size]="size"
          [disabled]="form.pristine || (isDisabled$ | async)"
          [loading]="isLoading$ | async"
          (click)="onSubmit($event, result.idea.id)"
          type="button"
          iconStart="@tui.save"
        ></button>
        <button
          class="action bell"
          tuiIconButton
          appearance="primary"
          libEnterSubscribe
          [loading]="controlWatch.value === null"
          [isSubscribe]="controlWatch.value"
          (isSubscribeChanged)="onSubscribe($event)"
          [ideaId]="result.idea.id"
          [size]="size"
          [disabled]="controlWatch.value === null"
          type="button"
          [iconStart]="controlWatch.value ? '@tui.bell' : '@tui.bell-off'"
        ></button>
        <button
          *ngIf="isShowSearch$ | async"
          class="search"
          tuiIconButton
          appearance="outline"
          [size]="size"
          [disabled]="false"
          type="button"
          searchDialog
          #dialog=SearchDialog
          (click)="dialog.onSearch($event)"
          (selected)="onSearch($event)"
          iconStart="@tui.search"
        ></button>
        <div class="container__space container__space--first"></div>
        <lib-enter-sidebar-instrument
          [data]="result.idea.instrument">
        </lib-enter-sidebar-instrument>
        <div class="container__space"></div>
        <div class="date-start" *ngIf="result.idea.createdAt">
          Идея от
          <span>{{ result.idea.createdAt | date : 'dd.MM.yyyy' }}</span>
        </div>
      </ng-container>
      <button
        appearance="icon"
        iconStart="@tui.x"
        tuiIconButton
        [size]="size"
        type="button"
        (click)="onClose($event)"
      ></button>
    </div>
  </div>
  <div
    [style.margin-left.%]="activeItemIndex * -100"
    class="container__widget-list">
    <div class="container__sidebar container__widget">
      <lib-enter-sidebar
        *ngIf="(data$ | async) as result; else load"
        [formGroup]="form"
        [formControl]="controlSidebar">
      </lib-enter-sidebar>
    </div>
    <div class="container__submit container__widget">
      <div class="submit" *ngIf="(data$ | async) as result; else load">
        <button
          class="action subscribe"
          appearance="secondary"
          tuiButton
          type="button"
          libEnterSubscribe
          [loading]="controlWatch.value === null"
          [isSubscribe]="controlWatch.value"
          (isSubscribeChanged)="onSubscribe($event)"
          [ideaId]="result.idea.id"
          [disabled]="controlWatch.value === null"
          [size]="size">
          <tui-icon [icon]="controlWatch.value ? '@tui.bell' : '@tui.bell-off'"></tui-icon>
          <span class="action__text">
            {{ controlWatch.value ? 'Отслеживать' : 'Не отслеживать' }}
          </span>
        </button>
        <button
          class="action save"
          [appearance]="form.pristine || (isDisabled$ | async)  ? 'secondary' : 'primary'"
          tuiButton
          type="button"
          [disabled]="form.pristine || (isDisabled$ | async)"
          [loading]="isLoading$ | async"
          (click)="onSubmit($event, result.idea.id)"
          [size]="size">
          <tui-icon icon="@tui.save"></tui-icon>
          <span class="action__text">
          Сохранить
          </span>
        </button>
        <button
          class="action trash"
          appearance="flat"
          tuiButton
          [size]="size"
          (click)="onDelete($event, result.idea.id)"
          type="button">
          <tui-icon icon="@tui.trash"></tui-icon>
          <span class="action__text">
          Удалить идею
          </span>
        </button>
      </div>
    </div>
    <div class="container__chart container__widget">
      <div class="widget">
        <lib-chart></lib-chart>
      </div>
    </div>
    <div class="container__idea container__widget">
      <div class="widget">
        <tui-notification appearance="negative" *ngIf="maxAmount$ | async" @heightAnimations>
          Количество в целях не должно превышать количество входа в идее
        </tui-notification>
        <tui-notification appearance="positive" *ngIf="isShowCopyNotify$ | async" @heightAnimations>
          Идея бота скопирована
        </tui-notification>
        <div class="widget__header">
          <div class="header">
            Идея
            <button
              *ngIf="isCanCopy$ | async"
              class="header__action"
              tuiButton
              appearance="flat"
              tuiHint="Скопируйте идею для создания новой с возможностью редактирования"
              tuiHintAppearance="dark"
              size="xs"
              type="button"
              (click)="onCopy($event)"
              iconStart="@tui.copy">
              Скопировать идею
            </button>
          </div>
        </div>
        <div class="widget__content">
          <tui-scrollbar class="scrollbar" [hidden]="true">
            <lib-enter-idea
              *ngIf="(data$ | async) as result; else load"
              [formGroup]="form"
              [formControl]="controlIdea"
              class="tui-zero-scrollbar">
            </lib-enter-idea>
          </tui-scrollbar>
        </div>
      </div>
    </div>
    <div class="container__action container__widget">
      <div class="widget">
        <div class="widget__header">
          <div class="header">
            Сделка
          </div>
        </div>
        <div class="widget__content">
          <tui-scrollbar class="scrollbar" [hidden]="true">
            <lib-enter-action
              *ngIf="(data$ | async) as result; else load"
              [formGroup]="form"
              [formControl]="controlActions"
              class="tui-zero-scrollbar">
            </lib-enter-action>
          </tui-scrollbar>
        </div>
      </div>
    </div>
  </div>
  <div class="container__tabs" *ngIf="(tabs$ | async) as tabs">
    <tui-tabs
      class="tabs"
      [(activeItemIndex)]="activeItemIndex">
      <button
        *ngFor="let item of tabs; trackBy: trackByIndex; index as i"
        class="tab"
        [class.tab--active]="i === activeItemIndex"
        tuiTab>
        <tui-icon
          class="tab__icon"
          [icon]="item.icon"
        ></tui-icon>
        <span class="tab__text">
            {{ item.text }}
          </span>
      </button>
    </tui-tabs>
  </div>
</div>

<ng-template #load>
  <ui-loader style="width: 100%;"></ui-loader>
</ng-template>
