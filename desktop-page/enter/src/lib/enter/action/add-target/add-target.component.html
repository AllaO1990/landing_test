<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3>Добавить выход</h3>
  </div>
  <div class="form__form">
    <tui-input-date-time
      [max]="maxDate"
      [tuiTextfieldCleaner]="true"
      class="form__control"
      formControlName="date"
      tuiTextfieldSize="s">
      Выбрать дату
    </tui-input-date-time>
    <tui-input-number
      class="form__control"
      tuiAutoFocus
      [tuiTextfieldCustomContent]="priceIncrement"
      [tuiTextfieldSize]="size"
      [tuiNumberFormat]="{precision: precision}"
      formControlName="price">
      Цена
      <input name="price" autocomplete="off" tuiTextfieldLegacy />
    </tui-input-number>
    <tui-input-number
      class="form__control"
      [tuiTextfieldSize]="size"
      [tuiNumberFormat]="{precision: precisionAmount}"
      formControlName="amount">
      Количество
      <input name="quantity" autocomplete="off" tuiTextfieldLegacy />
    </tui-input-number>
    <tui-select
      *ngIf="(brokers$ | async) as items"
      class="form__control"
      [valueContent]="stringify(items)"
      [tuiTextfieldSize]="size"
      formControlName="brokerId">
      Брокер
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.brokerId">
            {{ item.broker }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <!--    <tui-select class="form__control" [valueContent]="broker" [tuiTextfieldSize]="size" formControlName="broker">-->
    <!--      Брокер-->
    <!--      <input autocomplete="off" tuiTextfieldLegacy />-->
    <!--      <tui-data-list-wrapper *tuiDataList [itemContent]="broker" [items]="brokers$ | async" />-->
    <!--    </tui-select>-->
  </div>
  <div class="form__actions">
    <button class="form__action" [size]="size" tuiButton appearance="secondary" type="button"
            (click)="onCancel($event)">
      Отменить
    </button>
    <button class="form__action" [size]="size" tuiButton [disabled]="form.invalid" type="submit">
      Сохранить
    </button>
  </div>
</form>

<ng-template #broker let-item>
  {{ item.broker }}
</ng-template>

<ng-template #priceIncrement>
  <span class="form__increment" *ngIf="minPriceIncrement !== null">
    Шаг цены: {{ getNumberFromE(minPriceIncrement) }}
  </span>
</ng-template>
