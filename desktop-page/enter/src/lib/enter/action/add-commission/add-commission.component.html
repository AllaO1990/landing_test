<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3>Добавить комиссию</h3>
  </div>
  <div class="form__form">
    <tui-input-date-time
      [tuiTextfieldCleaner]="true"
      [max]="maxDate"
      class="form__control"
      formControlName="date"
      [tuiTextfieldSize]="size">
      Выбрать дату
    </tui-input-date-time>
    <tui-select
      *ngIf="(brokers$ | async) as items"
      class="form__control"
      [valueContent]="stringify(items)"
      [tuiTextfieldSize]="size"
      formControlName="brokerId">
      Брокер
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.brokerId">
            {{ item.broker }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <tui-textfield
      [tuiTextfieldSize]="size"
      class="form__control">
      <input
        placeholder="Комиссия"
        tuiInputNumber
        tuiAutoFocus
        [tuiNumberFormat]="{precision: 2}"
        formControlName="size"
      />
    </tui-textfield>
    <tui-textarea
      class="form__control"
      formControlName="comment"
      [tuiTextfieldSize]="size">
      Добавить комментарий
    </tui-textarea>
  </div>
  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      [disabled]="form.invalid"
      tuiButton
      type="submit">
      Сохранить
    </button>
  </div>
</form>
