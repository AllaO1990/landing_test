<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3>Добавить Стоп</h3>
  </div>
  <div tuiAppearance="floating" tuiCardLarge="compact" class="form__card">
    <ui-form-price-lots
      [autoFocus]="false"
      [options]="options"
      formControlName="add"
    ></ui-form-price-lots>
  </div>

  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>

    <button
      class="form__action"
      [size]="size"
      tuiButton
      [disabled]="form.invalid"
      type="submit">
      Сохранить
    </button>
  </div>
</form>
