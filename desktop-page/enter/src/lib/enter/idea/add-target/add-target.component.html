<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3> Добавить цель</h3>
  </div>
  <div class="form__container">
    <div class="form__control">
      <span>Выбрать дату</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          [max]="maxDay"
          [min]="minDay"
          placeholder="Выбрать дату"
          formControlName="stopDate"
          tuiInputDateTime
          autocomplete="off"
        />
        <tui-calendar *tuiTextfieldDropdown/>
      </tui-textfield>
    </div>

    <div class="form__control">
      <span>Цена</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          placeholder="Цена"
          tuiAutoFocus
          tuiInputNumber
          [tuiNumberFormat]="{precision: precision}"
          [min]="minPrice"
          [max]="maxPrice"
          [quantum]="numberFromIncrement"
          formControlName="price"
        />
        @if (minPriceIncrement !== null) {
          <span class="form__increment">
    Шаг цены: {{ numberFromIncrement }}
  </span>
        }
      </tui-textfield>
    </div>

    <div class="form__row">
      <div class="form__control">
        <span>Лоты</span>
        <tui-textfield
          [tuiTextfieldSize]="size">
          <input
            placeholder="Лоты"
            tuiInputNumber
            [tuiNumberFormat]="{precision: precisionAmount}"
            [min]="0"
            [max]="maxAmount"
            [quantum]="numberFromIncrement"
            formControlName="lots"
          />
          @if (lot) {
            <span>1 лот: {{ lot }} шт.</span>
          }
        </tui-textfield>
      </div>

      <div class="form__control">
        <span>Количество</span>
        <tui-textfield
          [tuiTextfieldSize]="size">
          <input
            placeholder="Количество"
            tuiInputNumber
            [tuiNumberFormat]="{precision: precisionAmount}"
            [min]="0"
            [max]="maxAmount"
            [quantum]="numberFromIncrement"
            formControlName="amount"
          />
        </tui-textfield>
      </div>
    </div>
  </div>
  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      tuiButton
      [disabled]="form.invalid"
      type="submit">
      Сохранить
    </button>
  </div>
</form>
