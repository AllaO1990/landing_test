<form class="form" [formGroup]="control" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3> Добавить цель</h3>
  </div>
  <ui-form-price-lots
    [autoFocus]="true"
    [options]="options"
    [formControl]="control"
  ></ui-form-price-lots>
  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      type="submit">
      Добавить
    </button>
    <div class="space"></div>
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      tuiButton
      [disabled]="control.invalid"
      type="submit">
      Сохранить
    </button>
  </div>
</form>
