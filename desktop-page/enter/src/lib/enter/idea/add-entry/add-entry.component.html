<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3>Добавить Вход</h3>
  </div>
  <div class="form__container">

    <div class="form__controls">
      <div class="form__control">
        <tui-textfield
          tuiChevron
          [stringify]="stringifyPositionType(positionType)"
          [tuiTextfieldSize]="size"
          [tuiTextfieldCleaner]="false">

          <input
            tuiAutoFocus
            formControlName="positionType"
            placeholder="Выбрать направление"
            tuiSelect/>

          <tui-data-list *tuiTextfieldDropdown>
            @for (item of positionType; track item.id) {
              <button
                new
                tuiOption
                type="button"
                [value]="item.id">
                {{ item.name }}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
      </div>
    </div>

    <div tuiAppearance="floating" tuiCardLarge="compact" class="form__card">
      <ui-form-price-lots
        [autoFocus]="false"
        [options]="options"
        formControlName="add"
      ></ui-form-price-lots>
    </div>

  </div>
  <div class="form__actions">

    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>

    <button
      class="form__action"
      [size]="size"
      [disabled]="form.invalid"
      tuiButton
      type="submit">
      Сохранить
    </button>

  </div>
</form>

<ng-template #contentPositionType let-item>
  {{ item.name }}
</ng-template>
