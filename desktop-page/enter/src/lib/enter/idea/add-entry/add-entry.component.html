<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3>Добавить Вход</h3>
  </div>
  <div class="form__container">

    <div class="form__controls form__control">
      <tui-textfield
        tuiChevron
        [stringify]="stringifyPositionType"
        [tuiTextfieldSize]="size"
        [tuiTextfieldCleaner]="false">

        <input
          tuiAutoFocus
          formControlName="positionType"
          placeholder="Выбрать направление"
          tuiSelect/>

        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="positionType"
          [itemContent]="contentPositionType"
        />
      </tui-textfield>
    </div>


    <div tuiAppearance="floating" tuiCardLarge="compact" class="form__card">
      <lib-add
        [autoFocus]="false"
        [options]="options"
        formControlName="add">
      </lib-add>
    </div>

  </div>
  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      [disabled]="form.invalid"
      tuiButton
      type="submit">
      Сохранить
    </button>
  </div>
</form>
