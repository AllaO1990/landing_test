<form class="valid-date" [formGroup]="form">
  <div class="valid-date__label">{{ constants.title }}</div>
  <div class="valid-date__row">
    <div class="valid-date__calendar">
      <tui-input-date
        formControlName="calendar"
        tuiTextfieldSize="s">
        {{ constants.calendar }}
      </tui-input-date>
    </div>
    <div class="valid-date__checkbox">
     <label tuiLabel> <input tuiCheckbox type="checkbox"
        formControlName="checkbox"
        size="s">
        {{ constants.checkbox }}
      </label>
    </div>
  </div>
</form>
