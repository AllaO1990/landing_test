<div class="widget" [formGroup]="form">
  <tui-scrollbar>
    <div class="tui-zero-scrollbar">
      <div class="widget__portfolio widget__padding portfolio">
        <div class="portfolio__label">
          Портфель
        </div>
        <div class="portfolio__actions">
          <lib-control-portfolio
            class="portfolio__select"
            [items]="portfolio$ | async"
            [formControl]="formControlPortfolio">
          </lib-control-portfolio>
          <!--        <tui-select-->
          <!--          class="portfolio__select"-->
          <!--          *ngIf="portfolio$ | async as list"-->
          <!--          [stringify]="stringifyPortfolio"-->
          <!--          [tuiTextfieldSize]="size"-->
          <!--          [formControl]="formControlPortfolio"-->
          <!--          [tuiTextfieldLabelOutside]="true">-->
          <!--          <tui-data-list-wrapper-->
          <!--            *tuiDataList-->
          <!--            [size]="size"-->
          <!--            [items]="list"-->
          <!--            [itemContent]="contentPortfolio">-->
          <!--          </tui-data-list-wrapper>-->
          <!--        </tui-select>-->
          <tui-select
            class="portfolio__currency"
            *ngIf="currencies$ | async as list"
            [stringify]="stringifyCurrency"
            [tuiTextfieldSize]="size"
            [formControl]="formControlCurrency"
            [tuiTextfieldLabelOutside]="true">
            <tui-data-list-wrapper
              *tuiDataList
              [size]="size"
              [items]="list"
              [itemContent]="contentCurrency">
            </tui-data-list-wrapper>
          </tui-select>
        </div>
      </div>
      <div class="widget__valid-date widget__padding">
        <lib-enter-sidebar-valid-date formControlName="expirationDate">
        </lib-enter-sidebar-valid-date>
      </div>
      <div class="widget__implementation widget__padding">
        <div>
          <label
            *ngFor="let item of strategy"
            class="item"
            appearance=""
            [tuiBlock]="size">
            <input
              size="s"
              [formControl]="formControlStrategy"
              tuiBlock
              type="radio"
              [value]="item" />
            {{ item.name }}
          </label>
        </div>
      </div>
      <div class="widget__strategy widget__padding">
        <label
          *ngFor="let item of positionType"
          class="item"
          appearance=""
          [tuiBlock]="size">
          <input
            size="s"
            formControlName="positionType"
            tuiBlock
            type="radio"
            [value]="item.id" />
          {{ item.name }}
        </label>
      </div>
      <div class="widget__description description widget__padding">
        <!--        <div class="description__row">-->
        <!--          <div class="description__label">Вероятность успеха</div>-->
        <!--          <div class="description__text">-->
        <!--            &lt;!&ndash;            {{ value.strategy.successProbability * 100 | tuiFormatNumber | async }}%&ndash;&gt;-->
        <!--          </div>-->
        <!--        </div>-->
        <!--        <div class="description__row">-->
        <!--          <div class="description__label">% вероятность успеха</div>-->
        <!--          <div class="description__text">-->
        <!--            &lt;!&ndash;            {{ value.inPositionDepositShare  | tuiFormatNumber | async }}%&ndash;&gt;-->
        <!--          </div>-->
        <!--        </div>-->
        <div class="description__row" *ngIf="(idea$ | async) as data">
          <div class="description__label">Сектор экономики</div>
          <div class="description__text">{{ data.idea.instrument.sector }}</div>
        </div>
        <!--        <div class="description__row">-->
        <!--          <div class="description__label">% сектора в вашем портфеле</div>-->
        <!--          <div class="description__text">&mdash;</div>-->
        <!--        </div>-->
      </div>
      <div class="widget__comment comment widget__padding">
        <div class="comment__label">
          {{ constants.comment_label }}
        </div>
        <div class="comment__area">
          <tui-textarea formControlName="comment" tuiTextfieldSize="s">
            {{ constants.comment_area }}
          </tui-textarea>
        </div>
      </div>
      <div class="widget__space"></div>
    </div>
  </tui-scrollbar>
</div>

<ng-template #contentCurrency let-item>
  {{ item.currencySymbol }}
</ng-template>

<ng-template #contentPortfolio let-item>
  {{ item.portfolio }}
</ng-template>
