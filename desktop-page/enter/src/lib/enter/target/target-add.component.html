<div class="target" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="target__header">
    <h3> Добавить цель <span *ngIf="context.data.target">{{ context.data.target }}</span></h3>
  </div>
  <div class="target__form">
    <tui-input-number
      class="target__control"
      [tuiTextfieldSize]="size"
      formControlName="price">
      Цена
      <input
        name="price"
        tuiTextfieldLegacy
      />
    </tui-input-number>
    <tui-input-number
      class="target__control"
      [tuiTextfieldSize]="size"
      formControlName="amount">
      Количество
      <input
        name="amount"
        tuiTextfieldLegacy
      />
    </tui-input-number>
  </div>
  <div class="target__actions">
    <button
      class="target__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="target__action"
      [size]="size"
      tuiButton
      type="submit">
      Добавить
    </button>
  </div>
</div>
