<div class="dialog">
  <div class="dialog__close">
    <button
      appearance="icon"
      iconStart="@tui.x"
      tuiIconButton
      size="s"
      type="button"
      (click)="onClose($event)"
    ></button>
  </div>
  <div class="dialog__header">
    <div class="dialog__title">
      <svg
        class="check"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path vector-effect="non-scaling-stroke" d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5" />
        <path stroke="var(--tui-text-positive)" class="animate" vector-effect="non-scaling-stroke" d="m9 11 3 3L22 4" />
      </svg>

      Сделка закрыта!
    </div>
  </div>
  <div class="dialog__content">
    <video
      [src]="videoSrc"
      autoplay=""
      loop=""
      playsinline=""
      width="256"
      height="256"></video>
  </div>
  <div class="dialog__action">
    <p>Посмотреть сделку в <a tuiLink (click)="onClick($event)">Портфеле</a></p>
  </div>
</div>
