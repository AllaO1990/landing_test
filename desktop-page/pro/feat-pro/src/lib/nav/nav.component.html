<tui-items-with-more
  tuiGroup
  [collapsed]="true">
  <ng-container *ngFor="let item of (links$ | async); trackBy: trackByIndex">
    <a
      *tuiItem
      [routerLink]="$any(item.disabled ? null : item.path)"
      [queryParams]="item.params"
      routerLinkActive
      #rla="routerLinkActive"
      [routerLinkActiveOptions]="{ matrixParams: 'exact', queryParams: 'ignored', paths: 'exact', fragment: 'exact' }"
      [appearance]="rla.isActive ? 'primary' : 'outline-grayscale'"
      [size]="size"
      tuiButton
      [tuiAppearanceState]="item.disabled | isDisabledState"
      [iconStart]="item.icon"
      type="button">
      {{ item.name }}
    </a>
  </ng-container>
  <button
    *tuiItem
    appearance="outline-grayscale"
    [size]="size"
    tuiIconButton
    iconStart="@tui.log-out"
    type="button"
    (click)="logout()">
  </button>

  <ng-template
    let-lastIndex
    tuiMore>

    <div [(tuiDropdownOpen)]="isDropdownOpen"
         tuiDropdownAlign="right"
         class="item"
         [tuiDropdown]="dropdown">

      <button
        iconStart="@tui.ellipsis-vertical"
        tuiIconButton
        type="button"
        appearance="whiteblock"
        [size]="size">
      </button>

      <ng-template #dropdown>
        <tui-data-list role="menu" size="m">
          <tui-opt-group>
            <ng-container
              *ngFor="let item of (links$ | async); let index = index; trackBy: trackByIndex">
              <a
                tuiOption
                (click)="onCloseDropDown($event, item)"
                [tuiAppearance]="rla.isActive ? 'flat' : 'flat-grayscale'"
                [tuiAppearanceState]="item.disabled | isDisabledState"
                *ngIf="index > lastIndex"
                [routerLink]="$any(item.disabled ? null : item.path)"
                routerLinkActive
                #rla="routerLinkActive"
                [iconStart]="item.icon"
                [attr.aria-checked]="rla.isActive">
                {{ item.name }}
              </a>
            </ng-container>
            <button
              tuiOption
              class="link-option"
              iconStart="@tui.log-out"
              (click)="logout()">
              Выход
            </button>
          </tui-opt-group>
        </tui-data-list>
      </ng-template>
    </div>
  </ng-template>
</tui-items-with-more>
