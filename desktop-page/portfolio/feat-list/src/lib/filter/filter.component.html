<div class="filter" [formGroup]="formGroup">
  <div class="filter__item filter__select">
    <lib-control-portfolio
      class="portfolio__select"
      [items]="portfolios$ | async"
      formControlName="portfolio">
    </lib-control-portfolio>
  </div>
  <div class="filter__item filter__select">
    <tui-textfield
      class="form__control"
      tuiChevron
      [identityMatcher]="identityMatcherCurrency()"
      [stringify]="stringifyCurrency()"
      [tuiTextfieldSize]="size"
      [tuiTextfieldCleaner]="false">
      <input
        formControlName="currency"
        [placeholder]="constants.currency"
        autocomplete="off"
        tuiSelect/>
      <tui-data-list-wrapper
        *tuiTextfieldDropdown
        new
        [items]="currency$ | async"
      />
    </tui-textfield>
  </div>
</div>
