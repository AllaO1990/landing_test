<form class="filter" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="filter__row">
    <div class="filter__control filter__control--portfolio">
      <label for="portfolio">Портфель:</label>
      <tui-textfield
        tuiChevron
        [identityMatcher]="identityMatcherPortfolio()"
        [stringify]="stringifyPortfolio()"
        [tuiTextfieldSize]="size"
        tuiDropdownLimitWidth="auto"
        [tuiTextfieldCleaner]="false">
        <input
          formControlName="portfolio"
          [placeholder]="'Портфель'"
          autocomplete="off"
          tuiSelect/>
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="portfolios$ | async"
          [itemContent]="portfolioContent"
        />
      </tui-textfield>
    </div>
    <div class="filter__control filter__control--broker">
      <label for="broker">Брокер:</label>
      <tui-textfield
        tuiChevron
        [identityMatcher]="identityMatcherBroker()"
        [stringify]="stringifyBroker()"
        [tuiTextfieldSize]="size"
        tuiDropdownLimitWidth="auto"
        [tuiTextfieldCleaner]="false">
        <input
          formControlName="broker"
          [placeholder]="'Брокер'"
          autocomplete="off"
          tuiSelect/>
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="brokers$ | async"
          [itemContent]="brokerContent"
        />
      </tui-textfield>
    </div>
    <div class="filter__control filter__control--currency">
      <label for="currency">Валюта:</label>
      <tui-textfield
        class="form__control"
        tuiChevron
        [identityMatcher]="identityMatcherCurrency()"
        [stringify]="stringifyCurrency()"
        [tuiTextfieldSize]="size"
        [tuiTextfieldCleaner]="false">
        <input
          formControlName="currency"
          [placeholder]="'Валюта'"
          autocomplete="off"
          tuiSelect/>
        <tui-data-list-wrapper
          *tuiTextfieldDropdown
          new
          [items]="currencies$ | async"
          [itemContent]="currencyContent"
        />
      </tui-textfield>
    </div>
  </div>
  <div class="filter__row">
    <div class="filter__control filter__control--range">
      Период:
      <lib-range-with-list
        formControlName="range"
        [items]="rangeList"
        [max]="maxDate"
        [itemContent]="itemRange"
        [selectHandler]="selectRangeHandler"
      ></lib-range-with-list>
    </div>
    <div class="filter__control filter__control--action">
      <button
        class="filter__action"
        [size]="size"
        tuiButton
        [disabled]="isDisabled$ | async"
        appearance="primary"
        type="submit">
        Показать
      </button>
    </div>
  </div>
</form>

<ng-template #portfolioContent let-item>
  {{ item.portfolio }}
</ng-template>

<ng-template #brokerContent let-item>
  {{ item.broker }}
</ng-template>

<ng-template #currencyContent let-item>
  {{ item.currencySymbol }}
</ng-template>

<ng-template #itemRange let-item>
  {{ item.text }}
</ng-template>
