<div class="wrapper">
  @if (data$ | async; as data) {
    <div class="wrapper__header">
      <div class="wrapper__title" [tuiSkeleton]="!data.isLoaded">
        График прибыли
      </div>

      <div class="space"></div>
      <div class="wrapper__action" [tuiSkeleton]="!data.isLoaded">
        <button
          tuiIconButton
          type="button"
          appearance="icon"
          iconStart="@tui.x"
          size="xs"
          (click)="onClose($event)">
        </button>
      </div>
    </div>

    <div class="wrapper__chart">
      @if (data.isLoaded && !data.isLoading) {
        <div class="wrapper__loader">
          <ui-loader></ui-loader>
        </div>
      }

      <portfolio-chart [tuiSkeleton]="!data.isLoaded" [data]="data.data"></portfolio-chart>
    </div>
  }
</div>
