<div class="profit" [formGroup]="form">
  <div class="profit__title">
    <h3>Прибыль</h3>
  </div>
  <div class="profit__container" *ngIf="data !== null; else load">
    <div class="profit__list">
      <div class="profit__deposit deposit">
        <dl class="deposit__row today">
          <dt class="deposit__title deposit__cell">{{ constants.today }}</dt>
          <dd class="deposit__description deposit__cell">
            {{ data.info.today !== null ? (data.info.today | tuiFormatNumber) : '—' }}
          </dd>
        </dl>
      </div>
      <div class="profit__form control">
        <div class="control__label">
          Период:
        </div>
        <div class="control__range">
          <tui-input-date-range
            class="b-form"
            tuiTextfieldSize="l"
            [tuiTextfieldLabelOutside]="true"
            formControlName="range">
          </tui-input-date-range>
        </div>
      </div>
      <div class="profit__deposit deposit">
        <dl class="deposit__row" *ngFor="let key of list; trackBy: trackByIndex">
          <dt class="deposit__title deposit__cell">
            {{ constants[key] }}
          </dt>
          <dd class="deposit__description deposit__cell">
            {{ data.info[key] !== null ? ($any(data.info[key]) | tuiFormatNumber) : '—' }}
          </dd>
        </dl>
      </div>
    </div>
    <div class="profit__chart">
      <!-- TODO: (Taiga UI migration) labels positioning on x axes were updated. Add empty string to axisXLabels array. See https://taiga-ui.dev/charts/axes -->
<tui-axes
        class="axes"
        [axisXLabels]="labelsX"
        [axisYLabels]="labelsY">
        <tui-bar-chart
          [max]="10000"
          [tuiHintAppearance]="'onDark'"
          [tuiHintContent]="hint"
          [value]="value"
        ></tui-bar-chart>
      </tui-axes>
    </div>
  </div>
  <div class="profit__actions">
    <div
      tuiGroup
      class="structure__controls"
      [collapsed]="true">
     <label *ngFor="let item of list$ | async" tuiBlock="l" appearance=""> <input tuiRadio type="radio"
        
        
        
        formControlName="list"
        
        [value]="item">
        {{ item.name }}
      </label>
    </div>
  </div>
</div>

<ng-template #load>
  <ui-loader></ui-loader>
</ng-template>
