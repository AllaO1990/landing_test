<div class="closed-deals">
  <div class="closed-deals__title">
    <h3>Сделка</h3>
    <!--    <div class="closed-deals__filter">-->
    <!--      <lib-filter-closed-deals [formControl]="formControl"></lib-filter-closed-deals>-->
    <!--    </div>-->
    <div class="space"></div>
    <div class="closed-deals__select">
      <span>{{ constants.transaction }}</span>
      <tui-select
        *ngIf="transaction$ | async as list"
        [valueContent]="transaction"
        [tuiTextfieldSize]="size"
        [formControl]="controlTransaction"
        [tuiTextfieldLabelOutside]="true">
        {{ constants.transaction }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="transaction">
        </tui-data-list-wrapper>
      </tui-select>
    </div>
    <tui-textfield
      tuiTextfieldSize="s"
      iconStart="@tui.search"
      class="closed-deals__search">
      <input
        [placeholder]="constants.search"
        tuiTextfield
        autocomplete="off"
        [formControl]="controlSearch"
      />
    </tui-textfield>
    <button
      tuiButton
      type="button"
      [size]="size"
      appearance="secondary"
      class="closed-deals__add-idea"
      uiSearchDialog
      #dialog=uiSearchDialog
      (click)="dialog.onSearch($event)"
      (selected)="onOpenDialog($event)">
      {{ constants.add_idea }}
    </button>
  </div>
  <div class="closed-deals__table">
    <lib-wrapper-table [params]="controlSearch.value"></lib-wrapper-table>
  </div>
</div>

<ng-template #transaction let-item>
  <div class="item">
    {{ item.value }}
  </div>
</ng-template>
