<lib-list
  [itemSize]="32"
  [list]="list"
  [header]="header">
  <div
    class="item row"
    *libListItem="let item">
    <div class="item__date row__item">
      <div class="date">
        <div class="date__open">
          {{ item.createdAt | date: 'dd.MM.yy' }}
        </div>
        <div class="date__close">
          {{ item.closeAt ? (item.closeAt | date: 'dd.MM.yy') : 'In stock' }}
        </div>
      </div>
    </div>
    <div class="item__position-type row__item">
      {{ item.positionType | getNamePositionType }}
    </div>
    <div class="item__name row__item"></div>
  </div>
</lib-list>

<ng-template #header>
  <lib-list-header class="item">
    <div class="item__date row__item">
      Дата вх/вых
    </div>
    <div class="item__position-type row__item">
      Напр.
    </div>
  </lib-list-header>
</ng-template>
