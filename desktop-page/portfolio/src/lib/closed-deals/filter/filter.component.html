<div class="filter" [formGroup]="formGroup">
  <div class="filter__item assets">
    <label for="filter--assets">
      <span>{{ constants.assets }}</span>
      <tui-select
        id="filter--assets"
        *ngIf="assets$ | async as list"
        [valueContent]="assets"
        [tuiTextfieldSize]="size"
        formControlName="assets"
        [tuiTextfieldLabelOutside]="true">
        {{ constants.assets }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="assets">
        </tui-data-list-wrapper>
      </tui-select>
    </label>
  </div>
  <div class="filter__item transaction">
    <label for="filter--transaction">
      <span>{{ constants.transaction }}</span>
      <tui-select
        id="filter--transaction"
        *ngIf="transaction$ | async as list"
        [valueContent]="transaction"
        [tuiTextfieldSize]="size"
        formControlName="transaction"
        [tuiTextfieldLabelOutside]="true">
        {{ constants.transaction }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="transaction">
        </tui-data-list-wrapper>
      </tui-select>
    </label>
  </div>
  <div class="filter__item portfolio">
    <label for="filter--portfolio">
      <span>{{ constants.portfolio }}</span>
      <tui-select
        id="filter--portfolio"
        *ngIf="portfolios$ | async as list"
        [valueContent]="portfolio"
        [tuiTextfieldSize]="size"
        formControlName="portfolio"
        [tuiTextfieldLabelOutside]="true">
        {{ constants.portfolio }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="portfolio">
        </tui-data-list-wrapper>
      </tui-select>
    </label>
  </div>
  <div class="filter__item broker">
    <label for="filter--broker">
      <span>{{ constants.broker }}</span>
      <tui-select
        id="filter--broker"
        *ngIf="broker$ | async as list"
        [valueContent]="broker"
        [tuiTextfieldSize]="size"
        formControlName="broker">
        {{ constants.broker }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="broker">
        </tui-data-list-wrapper>
      </tui-select>
    </label>
  </div>
  <div class="filter__item strategy">
    <label for="filter--strategy">
      <span>{{ constants.strategy }}</span>
      <tui-select
        id="filter--strategy"
        *ngIf="strategy$ | async as list"
        [valueContent]="strategy"
        [tuiTextfieldSize]="size"
        formControlName="strategy"
        [tuiTextfieldLabelOutside]="true">
        {{ constants.strategy }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="strategy">
        </tui-data-list-wrapper>
      </tui-select>
    </label>
  </div>
  <div class="filter__item currency">
    <label for="filter--currency">
      <span>{{ constants.currency }}</span>
      <tui-select
        id="filter--currency"
        *ngIf="currency$ | async as list"
        [valueContent]="currency"
        [tuiTextfieldSize]="size"
        formControlName="currency"
        [tuiTextfieldLabelOutside]="true">
        {{ constants.currency }}
        <tui-data-list-wrapper
          *tuiDataList
          size="s"
          [items]="list"
          [itemContent]="currency">
        </tui-data-list-wrapper>
      </tui-select>
    </label>
  </div>
</div>

<ng-template #assets let-item>
  <div class="item">
    {{ item.value }}
  </div>
</ng-template>

<ng-template #transaction let-item>
  <div class="item">
    {{ item.value }}
  </div>
</ng-template>

<ng-template #strategy let-item>
  <div class="item">
    {{ item.value }}
  </div>
</ng-template>

<ng-template #portfolio let-item>
  <div class="item">
    {{ item.portfolio }}
  </div>
</ng-template>

<ng-template #broker let-item>
  <div class="item">
    {{ item.broker }}
  </div>
</ng-template>

<ng-template #currency let-item>
  <div class="item">
    {{ item.currencySymbol }}
  </div>
</ng-template>
