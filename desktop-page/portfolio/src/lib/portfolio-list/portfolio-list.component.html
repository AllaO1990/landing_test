<div class="portfolio">
  <div class="portfolio__actions">
    <button
      class="portfolio__action button"
      [disabled]="true"
      tuiIconButton
      icon="tuiIconArrowDownCircle"
      size="l"
      type="button">
    </button>

    <button
      class="portfolio__action button"
      [disabled]="true"
      tuiIconButton
      icon="tuiIconArrowUpCircle"
      size="l"
      type="button">
    </button>
    <button
      class="portfolio__action button"
      [disabled]="true"
      tuiIconButton
      icon="tuiIconPercent"
      size="l"
      type="button">
    </button>
  </div>
  <div class="portfolio__deposit deposit" *ngIf="data; else load">
    <dl class="deposit__row" *ngFor="let key of list">
      <dt class="deposit__title deposit__cell">{{ constants[key] }}</dt>
      <dd class="deposit__description deposit__cell">{{ data[key] | tuiFormatNumber }}</dd>
    </dl>
  </div>
</div>

<ng-template #load>
  <ui-loader></ui-loader>
</ng-template>
