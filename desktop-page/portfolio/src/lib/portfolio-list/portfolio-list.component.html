<div class="portfolio">
  <div class="portfolio__title">
    <h3>Портфель</h3>
  </div>
  <div class="portfolio__container">
    <div class="portfolio__info" *ngIf="data; else load">
      <div class="card card--default">
        <div class="card__title">Депозит</div>
        <div class="card__list">
          <dl class="card__row" *ngFor="let key of listFirst">
            <dt class="card__cell card__name">
              {{ constants[key] }}
            </dt>
            <dd class="card__cell card__description">
              {{ data[key] | tuiFormatNumber | async }}
            </dd>
          </dl>
          <dl class="card__row">
            <dt class="card__cell card__name"></dt>
            <dd class="card__cell card__description"></dd>
          </dl>
        </div>
      </div>
      <div class="card card--default"></div>
      <div class="card card--success"></div>
      <div class="card card--warning"></div>
    </div>
    <div class="portfolio__description">
      <div class="portfolio__actions">
        <button
          class="portfolio__action button"
          [disabled]="true"
          tuiIconButton
          iconStart="@tui.circle-arrow-down"
          [size]="size"
          type="button">
        </button>

        <button
          class="portfolio__action button"
          [disabled]="true"
          tuiIconButton
          iconStart="@tui.circle-arrow-up"
          [size]="size"
          type="button">
        </button>
        <button
          class="portfolio__action button"
          [disabled]="true"
          tuiIconButton
          iconStart="@tui.percent"
          [size]="size"
          type="button">
        </button>
      </div>
    </div>
  </div>


  <!--  <div class="portfolio__deposit deposit" *ngIf="data; else load">-->
  <!--    <dl class="deposit__row" *ngFor="let key of list">-->
  <!--      <dt class="deposit__title deposit__cell">{{ constants[key] }}</dt>-->
  <!--      <dd class="deposit__description deposit__cell">{{ data[key] | tuiFormatNumber | async }}</dd>-->
  <!--    </dl>-->
  <!--  </div>-->
</div>

<ng-template #load>
  <ui-loader></ui-loader>
</ng-template>
