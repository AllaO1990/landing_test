<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header" *ngIf="label">
    <h3>Комиссии</h3>
  </div>
  <div class="form__form">
    <!--    <lib-control-portfolio-->
    <!--      [items]="portfolios$ | async"-->
    <!--      class="form__control"-->
    <!--      formControlName="portfolio">-->
    <!--      Портфель-->
    <!--    </lib-control-portfolio>-->
    <tui-select
      *ngIf="(portfolios$ | async) as items"
      class="form__control"
      [valueContent]="stringifyPortfolio(items)"
      [tuiTextfieldSize]="size"
      formControlName="portfolioId">
      Валюта
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.portfolioId">
            {{ item.portfolio }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <tui-select
      *ngIf="(currencies$ | async) as items"
      class="form__control"
      [valueContent]="stringifyCurrency(items)"
      [tuiTextfieldSize]="size"
      formControlName="currencyId">
      Валюта
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.currencyId">
            {{ item.currencySymbol }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <tui-select
      *ngIf="(brokers$ | async) as items"
      class="form__control"
      [valueContent]="stringifyBroker(items)"
      [tuiTextfieldSize]="size"
      formControlName="brokerId">
      Брокер
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.brokerId">
            {{ item.broker }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <lib-range-with-list
      formControlName="range"
      [items]="rangeList"
      [max]="max"
      [itemContent]="itemRange"
      [selectHandler]="selectRangeHandler"
    ></lib-range-with-list>
  </div>
  <div class="form__content">
    {{ form.value | json }}
    {{ list$ | async | json }}
  </div>
  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      [disabled]="form.invalid"
      tuiButton
      type="submit">
      Сохранить
    </button>
  </div>
</form>

<ng-template #itemRange let-item>
  {{ item.text }}
</ng-template>
