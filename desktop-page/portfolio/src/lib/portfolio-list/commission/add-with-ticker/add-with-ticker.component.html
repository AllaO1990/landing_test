<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header" *ngIf="label">
    <h3>{{ label }} для сделки <a tuiLink (click)="onShow($event)">{{ ticker }}</a></h3>
  </div>
  <div class="form__form">
    <lib-control-portfolio
      [items]="portfolios$ | async"
      class="form__control"
      formControlName="portfolio">
      Портфель
    </lib-control-portfolio>
    <tui-select
      *ngIf="(brokers$ | async) as items"
      class="form__control"
      [valueContent]="stringifyBroker(items)"
      [tuiTextfieldSize]="size"
      formControlName="brokerId">
      Брокер
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.brokerId">
            {{ item.broker }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <tui-textfield
      [tuiTextfieldSize]="size"
      class="form__control">
      <input
        placeholder="Цена"
        tuiInputNumber
        tuiAutoFocus
        [tuiNumberFormat]="{precision: 2}"
        formControlName="size"
        [postfix]="' ' + currencySymbol"
      />
    </tui-textfield>
    <tui-input-date-time
      [tuiTextfieldCleaner]="true"
      [max]="maxDate"
      [min]="minDate"
      class="form__control"
      formControlName="date"
      [tuiTextfieldSize]="size">
      Выбрать дату
    </tui-input-date-time>
    <tui-textarea
      class="form__control"
      formControlName="comment"
      [tuiTextfieldSize]="size">
      Добавить комментарий
    </tui-textarea>
  </div>
  <div class="form__actions">
    <div class="space"></div>
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      [loading]="isLoading$ | async"
      [disabled]="form.invalid || (isLoading$ | async)"
      tuiButton
      type="submit">
      Сохранить
    </button>
  </div>
</form>

<ng-template #itemRange let-item>
  {{ item.text }}
</ng-template>
