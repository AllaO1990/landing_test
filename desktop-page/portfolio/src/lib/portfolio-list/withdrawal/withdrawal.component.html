<form class="form" [formGroup]="form" (ngSubmit)="onSubmit($event)">
  <div class="form__header">
    <h3>Вывести средства</h3>
  </div>
  <div class="form__form">
    <lib-control-portfolio
      [items]="portfolios$ | async"
      class="form__control"
      formControlName="portfolio">
      Портфель
    </lib-control-portfolio>
    <tui-select
      *ngIf="(brokers$ | async) as items"
      class="form__control"
      [valueContent]="stringifyBroker(items)"
      [tuiTextfieldSize]="size"
      formControlName="brokerId">
      Брокер
      <input autocomplete="off" tuiTextfieldLegacy />
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            type="button"
            [value]="item.brokerId">
            {{ item.broker }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
    <div class="form__control form__row">
      <div class="form__value">
        <ui-loader *ngIf="isLoadValue$ | async"></ui-loader>
        <span *ngIf="(value$ | async) as value; else empty">
          {{ value['balance'] | tuiFormatNumber: { precision: 2, decimalMode: 'always' } | async }}
        </span>
      </div>
      <tui-select
        *ngIf="(currencies$ | async) as items"
        class="form__cell form__cell--currency"
        [valueContent]="stringifyCurrency(items)"
        [tuiTextfieldSize]="size"
        formControlName="currencyId">
        Валюта
        <input autocomplete="off" tuiTextfieldLegacy />
        <ng-template tuiDataList>
          <tui-data-list>
            <button
              *ngFor="let item of items"
              tuiOption
              type="button"
              [value]="item.currencyId">
              {{ item.currencySymbol }}
            </button>
          </tui-data-list>
        </ng-template>
      </tui-select>
    </div>
    <tui-textfield
      [tuiTextfieldSize]="size"
      class="form__control form__cell form__cell--amount">
      <input
        placeholder="Сумма"
        tuiInputNumber
        tuiAutoFocus
        [tuiNumberFormat]="{precision: 2}"
        formControlName="amount"
      />
    </tui-textfield>
    <tui-input-date-time
      [tuiTextfieldCleaner]="true"
      [max]="maxDate"
      class="form__control"
      formControlName="date"
      [tuiTextfieldSize]="size">
      Выбрать дату
    </tui-input-date-time>
    <tui-textarea
      class="form__control"
      formControlName="comment"
      [tuiTextfieldSize]="size">
      Добавить комментарий
    </tui-textarea>
  </div>
  <div class="form__actions">
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Закрыть
    </button>
    <div class="space"></div>
    <button
      class="form__action"
      [size]="size"
      [disabled]="form.invalid"
      tuiButton
      type="submit">
      Вывести
    </button>
  </div>
</form>

<ng-template #empty>
  <span>&mdash;.&mdash;&mdash;</span>
</ng-template>
