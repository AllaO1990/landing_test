<div class="filter">
  <ng-container *ngIf="isMobile$ | async; else form">
    <div
      class="filter__hosted-dropdown"
      [tuiDropdown]="dialog"
      [(tuiDropdownOpen)]="open">
      <button
        tuiIconButton
        type="button"
        appearance="outline"
        [tuiAppearanceMode]="open ? 'checked' : ''"
        iconEnd="@tui.filter"
        [size]="size">
      </button>
    </div>
  </ng-container>
</div>

<ng-template #portfolio let-item>
  <div class="item">
    {{ item.portfolio }}
  </div>
</ng-template>

<ng-template #broker let-item>
  <div class="item">
    {{ item.broker }}
  </div>
</ng-template>

<ng-template #currency let-item>
  <div class="item">
    {{ item.currencySymbol }}
  </div>
</ng-template>

<ng-template #form>
  <div class="filter__list list" [formGroup]="formGroup">
    <div class="filter__item portfolio">
      <label>
        <span>{{ constants.portfolio }}</span>
        <tui-select
          *ngIf="portfolios$ | async as list"
          [valueContent]="portfolio"
          [tuiTextfieldSize]="size"
          formControlName="portfolio"
          [tuiTextfieldLabelOutside]="true">
          <tui-data-list-wrapper
            *tuiDataList
            size="s"
            [items]="list"
            [itemContent]="portfolio">
          </tui-data-list-wrapper>
        </tui-select>
      </label>
    </div>
    <div class="filter__item broker">
      <label>
        <span>{{ constants.broker }}</span>
        <tui-select
          *ngIf="broker$ | async as list"
          [valueContent]="broker"
          [tuiTextfieldSize]="size"
          formControlName="broker">
          {{ constants.broker }}
          <tui-data-list-wrapper
            *tuiDataList
            size="s"
            [items]="list"
            [itemContent]="broker">
          </tui-data-list-wrapper>
        </tui-select>
      </label>
    </div>
    <div class="filter__item currency">
      <label>
        <span>{{ constants.currency }}</span>
        <tui-select
          *ngIf="currency$ | async as list"
          [valueContent]="currency"
          [tuiTextfieldSize]="size"
          formControlName="currency"
          [tuiTextfieldLabelOutside]="true">
          <tui-data-list-wrapper
            *tuiDataList
            size="s"
            [items]="list"
            [itemContent]="currency">
          </tui-data-list-wrapper>
        </tui-select>
      </label>
    </div>
    <div class="filter__item range">
      <label>
        <span>{{ constants.range }}</span>
        <lib-range-with-list
          formControlName="range"
          [items]="rangeList"
          [itemContent]="itemRange"
          [selectHandler]="selectRangeHandler"
        ></lib-range-with-list>
      </label>
    </div>
    <div class="filter__space"></div>
    <div class="filter__item to-currency">
      <label>
        <span>{{ constants.toCurrency }}</span>
        <tui-select
          *ngIf="currency$ | async as list"
          [valueContent]="currency"
          [tuiTextfieldSize]="size"
          formControlName="toCurrency"
          [tuiTextfieldLabelOutside]="true">
          <tui-data-list-wrapper
            *tuiDataList
            size="s"
            [items]="list"
            [itemContent]="currency">
          </tui-data-list-wrapper>
        </tui-select>
      </label>
    </div>
  </div>
</ng-template>

<ng-template #dialog>
  <div class="filter-dialog">
    <div class="filter-dialog__action">
      <button
        tuiIconButton
        type="button"
        appearance="icon"
        iconStart="@tui.x"
        size="m"
        (click)="onClose($event)">
      </button>
    </div>
    <ng-container [ngTemplateOutlet]="form"></ng-container>
  </div>
</ng-template>

<ng-template #itemRange let-item>
  {{ item.text }}
</ng-template>
