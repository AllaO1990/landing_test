<div class="structure">
  <div class="structure__title">
    <h3>Структура</h3>
  </div>
  <div class="structure__switcher">
    <div
      tuiGroup
      class="structure__controls"
      [collapsed]="true">
     <label *ngFor="let item of categories$ | async" tuiBlock="l" appearance=""> <input tuiRadio type="radio"
        
        
        
        [formControl]="controlCategories"
        
        [value]="item">
        {{ item.name }}
      </label>
    </div>
  </div>
  <div class="structure__container" *ngIf="(list$ | async) as list; else load">
    <div class="structure__list">
      <lib-list
        class="list"
        [list]="list"
        [itemSize]="32">
        <div
          class="list__item item"
          *libListItem="let item; index as i"
          [class.item__active]="activeItemIndex === i"
          (mouseenter)="onMouseenter($event, i)"
          (mouseleave)="onMouseleave($event)">
          <div class="item__name item__cell">
            {{ item.name }}
          </div>
          <div class="item__percentage item__cell">
            {{ item.percentage | tuiFormatNumber }}%
          </div>
        </div>
      </lib-list>
    </div>
    <div class="structure__chart">
      <tui-ring-chart
        [size]="(ringChartSize$ | async) || 'xl'"
        [value]="list | getListValue"
        [(activeItemIndex)]="activeItemIndex">
        <ng-container
          [ngTemplateOutlet]="(activeItemIndex | getIsNaN) ? full : item"
          [ngTemplateOutletContext]="{ $implicit:  list[activeItemIndex] }"
        ></ng-container>
      </tui-ring-chart>
    </div>
  </div>
</div>

<ng-template #load>
  <ui-loader></ui-loader>
</ng-template>

<ng-template #full>
  <div class="chart__info">
    <div class="chart__text">
      Всего:
    </div>
    <div class="chart__value">
      {{ summary | tuiFormatNumber }}
    </div>
  </div>
</ng-template>

<ng-template #item let-context>
  <div class="chart__info">
    <div class="chart__text">
      {{ context.name }}:
    </div>
    <div class="chart__value">
      {{ context.value | tuiFormatNumber }}
    </div>
  </div>
</ng-template>
