<div class="entry">
  <div class="entry__header">
    <div class="entry__title">
      {{ constants.title }}
    </div>
    <div class="entry__stock">

    </div>
    <div class="entry__action">
      <button
        tuiButton
        type="button"
        [size]="size"
        appearance="secondary"
        class="entry__add-idea"
        searchDialog
        #dialog=SearchDialog
        (click)="dialog.onSearch($event)"
        (selected)="onOpenDialog($event)">
        {{ constants.add_idea }}
      </button>

      <button
        [tuiDropdown]="dropdownContentMore"
        [tuiDropdownManual]="openMore"
        [tuiDropdownAlign]="'right'"
        [tuiDropdownOffset]="8"
        (click)="onOpenMore()"
        (tuiActiveZoneChange)="onActiveZoneMore($event)"
        (tuiObscured)="onObscuredMore($event)"
        iconStart="@tui.search"
        tuiIconButton
        type="button"
        [disabled]="true"
        appearance="outline-grayscale"
        [size]="size"
        class="entry__action-search">
      </button>

      <button
        [disabled]="true"
        iconStart="@tui.ellipsis-vertical"
        tuiIconButton
        type="button"
        appearance="outline-grayscale"
        [size]="size"
        class="entry__action-more">
      </button>
    </div>
  </div>
  <div class="entry__strategy" [formGroup]="formGroup">
    <tui-select
      *ngIf="types$ | async as list"
      [valueContent]="type"
      [tuiTextfieldSize]="size"
      formControlName="type"
      [tuiTextfieldLabelOutside]="true">
      {{ constants.type }}
      <tui-data-list-wrapper
        *tuiDataList
        size="s"
        [items]="list"
        [itemContent]="type">
      </tui-data-list-wrapper>
    </tui-select>

    <tui-select
      *ngIf="strategy$ | async as list"
      [valueContent]="strategy"
      [tuiTextfieldSize]="size"
      formControlName="strategy"
      [tuiTextfieldLabelOutside]="true">
      <tui-data-list-wrapper
        *tuiDataList
        size="s"
        [items]="list"
        [itemContent]="strategy">
      </tui-data-list-wrapper>
    </tui-select>

    <tui-select
      *ngIf="currency$ | async as list"
      [valueContent]="currency"
      [tuiTextfieldSize]="size"
      formControlName="currency"
      [tuiTextfieldLabelOutside]="true">
      {{ constants.currency }}
      <tui-data-list-wrapper
        *tuiDataList
        size="s"
        [items]="list"
        [itemContent]="currency">
      </tui-data-list-wrapper>
    </tui-select>

  </div>
  <div class="entry__table">
    <vt-entry-table [data]="list$ | async"></vt-entry-table>
  </div>
  <div class="entry__pagination">
    <lib-with-pagination
      [total]="(total$ | async) || 0"
      [formControl]="controlPaginationIdea"
      [items]="listPagination">
    </lib-with-pagination>
  </div>
</div>

<ng-template #dropdownContentMore>
  <tui-input
    tuiAutoFocus
    class="entry__search"
    [formControl]="controlSearch"
    tuiTextfieldSize="s"
    tuiTextfieldIconLeft="@tui.search"
    [tuiTextfieldCleaner]="true">
    {{ constants.search }}
    <input
      tuiTextfieldLegacy
      type="text"
    />
  </tui-input>
</ng-template>

<ng-template #content let-item>
  <div class="filter-content" [title]="item.name">
    {{ item.name }}
  </div>
</ng-template>

<ng-template #type let-item>
  <div class="item">
    {{ item.name }}
  </div>
</ng-template>

<ng-template #strategy let-item>
  <div class="item">
    {{ item.name }}
  </div>
</ng-template>

<ng-template #currency let-item>
  <div class="item">
    {{ item && item.currencySymbol }}
  </div>
</ng-template>
