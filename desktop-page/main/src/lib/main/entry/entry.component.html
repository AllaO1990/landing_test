<div class="entry">
  <div class="entry__header">
    <div class="entry__title">
      {{ constants.title }}
    </div>
    <div class="entry__stock">

    </div>
    <div class="entry__action">
      <button
        tuiButton
        type="button"
        [size]="size"
        appearance="secondary"
        class="entry__add-idea"
        (click)="onOpenDialog($event)">
        {{ constants.add_idea }}
      </button>

      <button
        [tuiDropdown]="dropdownContentMore"
        [tuiDropdownManual]="openMore"
        [tuiDropdownAlign]="'right'"
        [tuiDropdownOffset]="8"
        (click)="onOpenMore()"
        (tuiActiveZoneChange)="onActiveZoneMore($event)"
        (tuiObscured)="onObscuredMore($event)"
        iconStart="@tui.search"
        tuiIconButton
        type="button"
        appearance="outline-grayscale"
        [size]="size"
        class="entry__action-search">
      </button>

      <button
        [disabled]="true"
        iconStart="@tui.ellipsis-vertical"
        tuiIconButton
        type="button"
        appearance="outline-grayscale"
        [size]="size"
        class="entry__action-more">
      </button>
    </div>
  </div>
  <div class="entry__strategy">
    <tui-multi-select
      [formControl]="controlFilterStock"
      [rows]="1"
      [tuiTextfieldSize]="size"
      [identityMatcher]="identityMatcher"
      [stringify]="stringify"
      [tuiTextfieldCleaner]="true"
      [tuiTextfieldLabelOutside]="true">
      Активы
      <tui-data-list-wrapper
        *tuiDataList
        size="s"
        tuiMultiSelectGroup
        [items]="filterStock"
        [disabledItemHandler]="disabledItemHandler"
        [itemContent]="content"
      />
    </tui-multi-select>

    <tui-multi-select
      [formControl]="controlFilterStrategy"
      [rows]="1"
      [tuiTextfieldSize]="size"
      [identityMatcher]="identityMatcher"
      [stringify]="stringify"
      [tuiTextfieldCleaner]="true"
      [tuiTextfieldLabelOutside]="true">
      Стратегии
      <tui-data-list-wrapper
        *tuiDataList
        size="s"
        tuiMultiSelectGroup
        [items]="filterStrategy"
        [disabledItemHandler]="disabledItemHandler"
        [itemContent]="content"
      />
    </tui-multi-select>
  </div>
  <div class="entry__table">
    <vt-entry-table [data]="data$ | async"></vt-entry-table>
  </div>
</div>

<ng-template #dropdownContentMore>
  <tui-input
    tuiAutoFocus
    class="entry__search"
    [formControl]="controlSearch"
    tuiTextfieldSize="s"
    tuiTextfieldIconLeft="@tui.search"
    [tuiTextfieldCleaner]="true">
    {{ constants.search }}
    <input
      tuiTextfieldLegacy
      type="text"
    />
  </tui-input>
</ng-template>

<ng-template #content let-item>
  <div class="filter-content" [title]="item.name">
    {{ item.name }}
  </div>
</ng-template>
