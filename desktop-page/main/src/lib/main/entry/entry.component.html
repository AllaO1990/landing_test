<div class="entry">
  <div class="entry__header">
    <div class="entry__title">
      {{ constants.title }}
    </div>
    <div class="entry__stock">
      <tui-filter
        [formControl]="controlFilterStock"
        [size]="'s'"
        class="item"
        [content]="content"
        [items]="filterStock"
      ></tui-filter>
    </div>
    <div class="entry__action">
      <button
        [disabled]="true"
        tuiButton
        type="button"
        size="m"
        appearance="secondary"
        class="entry__add-idea">
        {{ constants.add_idea }}
      </button>

      <button
        [tuiDropdown]="dropdownContentMore"
        [tuiDropdownManual]="openMore"
        [tuiDropdownAlign]="'right'"
        [tuiDropdownOffset]="8"
        (click)="onOpenMore()"
        (tuiActiveZoneChange)="onActiveZoneMore($event)"
        (tuiObscured)="onObscuredMore($event)"
        icon="tuiIconMoreVertical"
        tuiIconButton
        type="button"
        appearance="icon"
        size="s"
        class="entry__search">
      </button>
    </div>
  </div>
  <div class="entry__strategy">
    <tui-filter
      [formControl]="controlFilterStrategy"
      [size]="'s'"
      class="item"
      [content]="content"
      [items]="filterStrategy"
    ></tui-filter>
  </div>
  <div class="entry__table">
    <vt-entry-table [data]="data"></vt-entry-table>
  </div>
</div>

<ng-template #dropdownContentMore>
  <tui-input
    class="entry__search"
    [formControl]="controlSearch"
    tuiTextfieldSize="s"
    tuiTextfieldIconLeft="tuiIconSearch"
    [tuiTextfieldCleaner]="true">
    {{ constants.search }}
    <input
      tuiTextfield
      type="text"
    />
  </tui-input>
</ng-template>

<ng-template #content let-item>
  {{ item.name }}
</ng-template>
