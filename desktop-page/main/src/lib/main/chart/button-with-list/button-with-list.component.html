<div
  tuiGroup
  [collapsed]="true">
  <button
    [appearance]="appearance"
    tuiIconButton
    type="button"
    [icon]="icon"
    size="l"
    (click)="onToggle($event)"
    [disabled]="disabled">
  </button>
  <tui-badged-content
    size="xs"
    [contentTop]="length$ | async">
    <button
      [appearance]="appearance"
      tuiIconButton
      size="l"
      type="button"
      [disabled]="disabled"
      [icon]="controlOpen ? 'tuiIconChevronUp' : 'tuiIconChevronDown'"
      [tuiDropdown]="content"
      [tuiDropdownManual]="controlOpen"
      [tuiDropdownAlign]="'right'"
      [tuiDropdownOffset]="8"
      (click)="onOpenMore()"
      (tuiActiveZoneChange)="onActiveZoneMore($event)"
      (tuiObscured)="onObscuredMore($event)">
    </button>
  </tui-badged-content>
</div>

<ng-template #content>
  <tui-data-list size="s">
    <tui-opt-group
      tuiMultiSelectGroup
      [formControl]="control">
      <button
        *ngFor="let item of list"
        tuiOption
        [value]="item">
        {{ item.name }}
      </button>
    </tui-opt-group>
  </tui-data-list>
</ng-template>
