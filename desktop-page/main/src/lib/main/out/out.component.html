<div class="out">
  <div class="out__header">
    <div class="out__title">
      {{ constants.title }}
    </div>
    <div class="out__stock">
      <tui-filter
        [formControl]="controlFilterStock"
        [size]="'s'"
        class="item"
        [content]="content"
        [items]="filterStock"
        [disabledItemHandler]="disabledItemHandler"
      ></tui-filter>
    </div>
    <div class="out__action">
      <button
        [tuiDropdown]="dropdownContentMore"
        [tuiDropdownManual]="openMore"
        [tuiDropdownAlign]="'right'"
        [tuiDropdownOffset]="8"
        (click)="onOpenMore()"
        (tuiActiveZoneChange)="onActiveZoneMore($event)"
        (tuiObscured)="onObscuredMore($event)"
        icon="tuiIconSearch"
        tuiIconButton
        type="button"
        appearance="icon"
        size="s"
        class="entry__search">
      </button>

      <button
        [disabled]="true"
        icon="tuiIconMoreVertical"
        tuiIconButton
        type="button"
        appearance="icon"
        size="s"
        class="entry__search">
      </button>
    </div>
  </div>
  <div class="out__strategy">
    <tui-filter
      [formControl]="controlFilterStrategy"
      [size]="'s'"
      class="item"
      [content]="content"
      [items]="filterStrategy"
      [disabledItemHandler]="disabledItemHandler"
    ></tui-filter>
  </div>
  <div class="out__table">
    <vt-out-table [data]="data$ | async"></vt-out-table>
  </div>
</div>

<ng-template #dropdownContentMore>
  <tui-input
    class="out__search"
    [formControl]="controlSearch"
    tuiTextfieldSize="s"
    tuiTextfieldIconLeft="tuiIconSearch"
    [tuiTextfieldCleaner]="true">
    {{ constants.search }}
    <input
      tuiTextfield
      type="text"
    />
  </tui-input>
</ng-template>

<ng-template #content let-item>
  {{ item.name }}
</ng-template>
