<div class="out">
  <div class="out__header">
    <div class="out__title">
      {{ constants.title }}
    </div>
    <div class="out__stock">
      <tui-filter
        [formControl]="controlFilterStock"
        [size]="size"
        class="item"
        [content]="content"
        [items]="filterStock"
        [disabledItemHandler]="disabledItemHandler"
      ></tui-filter>
    </div>
    <div class="out__actions">
      <button
        tuiButton
        type="button"
        [size]="size"
        appearance="secondary"
        class="entry__add-idea"
        (click)="onOpenDialog($event)">
        {{ constants.add_idea }}
      </button>

      <button
        [tuiDropdown]="dropdownContentMore"
        [tuiDropdownManual]="openMore"
        [tuiDropdownAlign]="'right'"
        [tuiDropdownOffset]="8"
        (click)="onOpenMore()"
        (tuiActiveZoneChange)="onActiveZoneMore($event)"
        (tuiObscured)="onObscuredMore($event)"
        iconStart="@tui.search"
        tuiIconButton
        type="button"
        appearance="outline-grayscale"
        [size]="size"
        class="out__action-search">
      </button>

      <button
        [disabled]="true"
        iconStart="@tui.ellipsis-vertical"
        tuiIconButton
        type="button"
        appearance="outline-grayscale"
        [size]="size"
        class="out__action-more">
      </button>
    </div>
  </div>
  <div class="out__strategy">
    <tui-filter
      [formControl]="controlFilterStrategy"
      [size]="size"
      class="item"
      [content]="content"
      [items]="filterStrategy"
      [disabledItemHandler]="disabledItemHandler"
    ></tui-filter>
  </div>
  <div class="out__table">
    <vt-out-table [data]="data$ | async"></vt-out-table>
  </div>
</div>

<ng-template #dropdownContentMore>
  <tui-input
    tuiAutoFocus
    class="out__search"
    [formControl]="controlSearch"
    tuiTextfieldSize="s"
    tuiTextfieldIconLeft="@tui.search"
    [tuiTextfieldCleaner]="true">
    {{ constants.search }}
    <input
      tuiTextfieldLegacy
      type="text"
    />
  </tui-input>
</ng-template>

<ng-template #content let-item>
  <div class="filter-content" [title]="item.name">
    {{ item.name }}
  </div>
</ng-template>
