<div class="container">
  <div class="vt-chart-container">
    <vt-chart
      [consolidationZones]="consolidationZones$ | async"
      [data]="candles$ | async"
      [selected]="selected$ | async"
      [selectedIdea]="selectedIdea$ | async"
    ></vt-chart>
  </div>

  <div class="stock">
    <vt-stock
      [list]="stockList$ | async"
      [price]="stockPrice$ | async"
    ></vt-stock>
  </div>

  <div class="entry">
    <vt-entry [data]="ideaList$ | async"></vt-entry>
  </div>

  <div class="out">
    <vt-out [data]="tradeList$ | async"></vt-out>
  </div>
</div>
