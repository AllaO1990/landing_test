<div class="toolbar">
  @if (selected$ | async; as selected) {
    <div class="toolbar__ticker">
      <div
        class="ticker"
        uiSearchDialog
        #dialog=uiSearchDialog
        (click)="dialog.onSearch($event)"
        (selected)="onSelect($event)">
        <tui-icon icon="@tui.search"></tui-icon>
        <div class="ticker__name">
          {{ selected.ticker }}
        </div>
      </div>
    </div>
  } @else {
    <ui-loader></ui-loader>
  }

  <div class="toolbar__space"></div>
</div>
