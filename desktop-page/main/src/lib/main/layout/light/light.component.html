<div class="layout" [class.layout--with-chart]="false">
  <div class="layout__portfolio widget"></div>
  <div class="layout__structure widget">
    <structure
      [data]="(dataStructure$ | async) || defaultDataStructure"
      (selectedCategory)="onSelectCategory($event)"

  </div>
  <div class="layout__chart widget"></div>
  <div class="layout__idea widget"></div>
  <div class="layout__out widget"></div>
</div>
