<div class="price" *ngIf="value; else skeleton">
  <div class="price__last">{{value.price| tuiFormatNumber:  {decimalLimit: 2} }}</div>
  <div class="price__change">{{value.change| tuiFormatNumber:  {decimalLimit: 2} }}</div>
  <div class="price__change-percent">{{value.changePercent| tuiFormatNumber:  {decimalLimit: 2} }}%</div>
</div>

<ng-template #skeleton>
  <div class="tui-skeleton">
    0
  </div>
</ng-template>
