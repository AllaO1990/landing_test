<div class="list">
  <div class="list__header header">
    <div
      class="header__col header__col--{{ item.name }}"
      *ngFor="let item of header; trackBy: trackByHeader"
    >
      {{ item.label }}
    </div>
  </div>

  <cdk-virtual-scroll-viewport itemSize="32" class="list__container">
    <vt-stock-list-item
      class="list__item stock-item"
      *cdkVirtualFor="let item of (list$ | async) || []; trackBy: trackByStockListItem"
      [item]="item"
      [formControl]="controlItem"
      [title]="item.name"
    >
      <div class="stock-item__row">
        <div class="stock-item__img">
          <img
            src="/assets/tickers-v2/{{ item.ticker }}.png"
            [attr.alt]="item.name"
          />
        </div>
        <div class="stock-item__name">
          {{ item.ticker }}
        </div>
        <div class="stock-item__sector">
          {{ item.sector }}
        </div>
        <div class="stock-item__price stock-item__last" *ngIf="item.price !== null; else skeleton">
          {{ item.price | tuiFormatNumber : {decimalLimit: 2} }}
        </div>
        <div class="stock-item__price stock-item__change" *ngIf="item.change !== null; else skeleton">
          {{ item.change | tuiFormatNumber : {decimalLimit: 2} }}
        </div>
        <div class="stock-item__price stock-item__change-percent" *ngIf="item.changePercent !== null; else skeleton">
          {{ item.changePercent | tuiFormatNumber : {decimalLimit: 2} }}%
        </div>
      </div>
    </vt-stock-list-item>
  </cdk-virtual-scroll-viewport>
</div>

<ng-template #skeleton>
  <div class="stock-item__load tui-skeleton">0</div>
</ng-template>
