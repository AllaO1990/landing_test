<div class="list">
  <div class="list__action action">
    <form class="action__form">
      <tui-select
        class="action__select"
        [stringify]="stringify"
        [tuiTextfieldSize]="'s'"
        [formControl]="controlName"
        [tuiTextfieldLabelOutside]="true">
        Выберите список
        <tui-data-list size="s" *tuiDataList>
          <tui-opt-group>
            <button
              *ngIf="!signatureVisible"
              tuiOption
              class="action__add-list"
              (click)="toggle()">
              <tui-svg
                src="tuiIconPlus"
                class="action__icon"
              ></tui-svg>
              Добавить список
            </button>
          </tui-opt-group>
          <tui-opt-group>
            <button
              *ngFor="let item of (nameList$ | async) || []; trackBy: trackByStockNameItem"
              tuiOption
              [disabled]="false"
              [value]="item">
              {{ item.name }}
            </button>
          </tui-opt-group>
        </tui-data-list>
      </tui-select>

      <div class="action__addition addition" *ngIf="signatureVisible">
        <tui-input
          class="addition__input"
          [formControl]="controlListName"
          tuiAutoFocus
          tuiTextfieldSize="s"
          [tuiTextfieldCleaner]="true">
          Название списка
          <input tuiTextfield />
        </tui-input>
        <button
          tuiIconButton
          [disabled]="false"
          (click)="addList($event)"
          type="button"
          class="addition__button addition__add"
          size="s"
          icon="tuiIconCheck"
        ></button>
        <button
          class="addition__button addition__toggle"
          size="s"
          icon="tuiIconClose"
          tuiIconButton
          appearance="secondary"
          type="button"
          (click)="toggle()">
        </button>
      </div>
    </form>
  </div>

  <vt-stock-list
    class="list__container"
    [list]="(list$ | async) || []"
    (selected)="onSelect($event)">
  </vt-stock-list>
</div>
