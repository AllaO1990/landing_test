<div class="list">
  <div class="list__action action">
    <form class="action__form" *ngIf="!isRename; else rename">
      <tui-select
        class="action__select"
        [stringify]="stringify"
        [tuiTextfieldSize]="'s'"
        [formControl]="controlGroup"
        [tuiTextfieldLabelOutside]="true">
        Выберите список
        <div *tuiDataList>
          <tui-data-list>
            <button
              tuiOption
              iconStart="@tui.plus"
              (click)="onEdit($event, default, 'new')">
              Добавить список
            </button>
          </tui-data-list>
          <hr />
          <tui-data-list-wrapper
            class="data-list-wrapper"
            [size]="size"
            [items]="groupDefault$ | async"
            [itemContent]="simple">
          </tui-data-list-wrapper>
          <hr />
          <tui-data-list-wrapper
            class="data-list-wrapper"
            [size]="size"
            [items]="groupsCustom$ | async"
            [itemContent]="item">
          </tui-data-list-wrapper>
        </div>
      </tui-select>
      <button
        class="action__add-instrument"
        [size]="size"
        iconStart="@tui.plus"
        tuiIconButton
        appearance="secondary"
        type="button"
        [disabled]="isDisabled"
        (click)="onAddInstrument($event)">
      </button>
    </form>
  </div>

  <vt-stock-list
    *ngIf="(list$ | async) as list; else load"
    class="list__container"
    [list]="list"
    [select]="event$ | async"
    (delete)="onDeleteInstrument($event)"
    (selected)="onSelect($event)">
  </vt-stock-list>
</div>

<ng-template #load>
  <div class="loader">
    <ui-loader></ui-loader>
  </div>
</ng-template>

<ng-template #rename>
  <lib-form-input
    class="action__rename"
    *ngIf="controlRename.value"
    [value]="controlRename.value"
    [stringify]="stringify"
    (formEvent)="onFormEvent($event)">
  </lib-form-input>
</ng-template>

<ng-template #item let-item>
  <div class="item">
    <div class="item__text">
      {{ item.name }}
    </div>
    <div class="space"></div>
    <div class="actions">
      <button
        class="edit"
        [size]="size"
        iconStart="@tui.pencil"
        tuiIconButton
        appearance="icon"
        type="button"
        (click)="onEdit($event, item, 'edit')">
      </button>
      <button
        class="remove"
        [size]="size"
        iconStart="@tui.trash-2"
        tuiIconButton
        appearance="icon"
        type="button"
        (click)="onRemove($event, item)">
      </button>
    </div>
  </div>
</ng-template>

<ng-template #simple let-item>
  <div class="item">
    {{ item.name }}
  </div>
</ng-template>
