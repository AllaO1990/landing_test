<tui-loader class="loader" [overlay]="true" [showLoader]="!((groups$ | async) || false)">
  <div class="list">
    <div class="list__action action">
      <form class="action__form" *ngIf="!isRename; else rename">
        <tui-select
          class="action__select"
          [stringify]="stringify"
          [tuiTextfieldSize]="'s'"
          [formControl]="controlGroup"
          [tuiTextfieldLabelOutside]="true">
          Выберите список
          <div *tuiDataList>
            <tui-data-list>
              <button
                tuiOption
                (click)="onEdit($event, default, 'new')">
                <tui-svg src="tuiIconPlus"></tui-svg>
                Добавить список
              </button>
            </tui-data-list>
            <hr />
            <tui-data-list-wrapper
              class="data-list-wrapper"
              size="s"
              [items]="groupsCustom$ | async"
              [itemContent]="item">
            </tui-data-list-wrapper>
            <hr />
            <tui-data-list-wrapper
              class="data-list-wrapper"
              size="s"
              [items]="groupsDefault$ | async"
              [itemContent]="simple">
            </tui-data-list-wrapper>
          </div>
        </tui-select>
        <button
          class="action__add-instrument"
          size="s"
          icon="tuiIconPlus"
          tuiIconButton
          appearance="secondary"
          type="button"
          (click)="onAddInstrument($event)">
        </button>
      </form>
    </div>

    <vt-stock-list
      *ngIf="(list$ | async) as list; else load"
      class="list__container"
      [list]="list"
      (delete)="onDeleteInstrument($event)"
      (selected)="onSelect($event)">
    </vt-stock-list>
  </div>
</tui-loader>

<ng-template #load>
  <div class="loader">
    <div class="loader__text">
      Загрузка...
    </div>
  </div>
</ng-template>

<ng-template #rename>
  <lib-form-input
    class="action__rename"
    *ngIf="controlRename.value"
    [value]="controlRename.value"
    [stringify]="stringify"
    (formEvent)="onFormEvent($event)">
  </lib-form-input>
</ng-template>

<ng-template #item let-item>
  <div class="item">
    {{ item.name }}
    <div class="space"></div>
    <div class="actions">
      <button
        class="edit"
        size="s"
        icon="tuiIconEdit2"
        tuiIconButton
        appearance="icon"
        type="button"
        (click)="onEdit($event, item, 'edit')">
      </button>
      <button
        class="remove"
        size="s"
        icon="tuiIconTrash2"
        tuiIconButton
        appearance="icon"
        type="button"
        (click)="onRemove($event, item)">
      </button>
    </div>
  </div>
</ng-template>

<ng-template #simple let-item>
  <div class="item">
    {{ item.name }}
  </div>
</ng-template>
