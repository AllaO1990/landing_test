<div class="layout">
  <div class="layout__header">
    <button
      [tuiSkeleton]="(isSkeleton$ | async) || false"
      appearance="icon"
      iconStart="@tui.search"
      tuiIconButton
      size="xs"
      type="button"
      uiSearchDialog
      #dialog=uiSearchDialog
      (click)="dialog.onSearch($event)"
      (selected)="onSelect($event)"
    ></button>
    <div class="layout__title" [tuiSkeleton]="(isSkeleton$ | async) || false">
      @if (instrument$ | async; as instrument) {
        {{ instrument.ticker }} ({{ instrument.name }})
      }
    </div>
    <div class="space"></div>
    <button
      [tuiSkeleton]="(isSkeleton$ | async) || false"
      appearance="icon"
      iconStart="@tui.x"
      tuiIconButton
      size="xs"
      type="button"
      (click)="onClose($event)"
    ></button>
  </div>
  <div class="layout__chart">
    <lib-chart [tuiSkeleton]="(isSkeleton$ | async) || false"></lib-chart>
  </div>
</div>
