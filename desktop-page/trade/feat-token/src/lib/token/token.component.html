<div class="dialog form" [formGroup]="formGroup">
  <div class="dialog__title">
    <h3>
      {{ typeTitle === 'add' ? 'Добавить токен' : 'Изменить токен' }}
    </h3>
  </div>
  <div class="dialog__container">
    <label class="form__control">
      <span>Источник</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          placeholder="Источник"
          tuiTextfield
          formControlName="source"
        />
      </tui-textfield>
    </label>

    <label class="form__control">
      <span>Название</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          placeholder="Название"
          tuiTextfield
          formControlName="name"
        />
      </tui-textfield>
    </label>

    <label class="form__control">
      <span>Токен</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          tuiAutoFocus
          placeholder="Токен"
          tuiTextfield
          formControlName="token"
        />
      </tui-textfield>
    </label>
  </div>
  <div class="form__actions">
    <div class="space"></div>
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      class="form__action"
      [size]="size"
      tuiButton
      appearance="primary"
      type="button"
      [disabled]="formGroup.invalid"
      (click)="onSave($event)">
      Сохранить
    </button>
  </div>
</div>
