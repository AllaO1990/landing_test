<form class="dialog" [formGroup]="formGroup" (ngSubmit)="onSubmit($event)">
  <div class="dialog__container">
    <trade-form formControlName="trade"></trade-form>
  </div>
  <div class="dialog__actions">
    <div class="space"></div>
    <button
      (click)="onClose($event)"
      appearance="secondary"
      tuiButton>
      Закрыть
    </button>
    <button
      type="submit"
      [disabled]="isDisabled$ | async"
      (click)="onSubmit($event)"
      appearance="primary"
      tuiButton>
      Подтвердить
    </button>
  </div>
</form>
