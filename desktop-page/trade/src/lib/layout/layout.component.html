<form class="dialog" [formGroup]="formGroup" (ngSubmit)="onSubmit($event)">
  <div class="dialog__container">
    @if (isMobile$ | async) {
      <trade-mobile-form formControlName="trade"></trade-mobile-form>
    } @else {
      <trade-desktop-form formControlName="trade"></trade-desktop-form>
    }
    <!--    <trade-form formControlName="trade"></trade-form>-->
  </div>
  <div class="dialog__actions">
    <div class="space"></div>
    <button
      (click)="onClose($event)"
      appearance="secondary"
      tuiButton>
      Закрыть
    </button>
    <!--      [disabled]="loading || (isDisabled$ | async)"-->
    <!--      [loading]="loading"-->
    <button
      [loading]="isLoading$ | async"
      type="submit"
      (click)="onSubmit($event)"
      appearance="primary"
      tuiButton>
      Подтвердить
    </button>
  </div>
</form>
