<div class="dialog">
  <div class="dialog__container">
    <trade-layout></trade-layout>
  </div>
  <div class="dialog__actions">
    <div class="space"></div>
    <button
      (click)="onClose($event)"
      appearance="secondary"
      tuiButton>
      Отменить
    </button>
    <button
      (click)="onConfirm($event)"
      appearance="primary"
      tuiButton>
      Подтвердить
    </button>
  </div>
</div>
