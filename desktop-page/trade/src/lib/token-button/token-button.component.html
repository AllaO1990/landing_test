<div tuiGroup class="filter">
  <button
    *ngIf="value.token === null; else buttonCheck"
    [size]="size"
    class="filter__token-action"
    tuiButton
    iconEnd="@tui.plus"
    appearance="secondary"
    (click)="addToken($event)"
    type="button">
    <span>Добавить токен</span>
  </button>
  <button
    class="filter__token-remove"
    [size]="size"
    tuiIconButton
    iconEnd="@tui.x"
    appearance="secondary"
    [disabled]="value.token === null"
    (click)="removeToken($event)"
    type="button">
  </button>
</div>

<ng-template #buttonCheck>
  <button
    [size]="size"
    class="filter__token-action"
    tuiButton
    iconEnd="@tui.check"
    appearance="positive"
    (click)="addToken($event)"
    type="button">
    <span>{{ value.token.name }}</span>
  </button>
</ng-template>
