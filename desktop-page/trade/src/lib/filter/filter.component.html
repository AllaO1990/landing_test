<form class="form" [formGroup]="formGroup">
  <lib-instrument [data]="controlInstrument.value"></lib-instrument>
  <div class="space"></div>
  <label class="form__control label" *ngIf="sources$ | async as list; else load">
    <span class="label__text">
      Источник
    </span>
    <tui-select
      class="label__action filter__source"
      [stringify]="stringifySource"
      [tuiTextfieldSize]="size"
      formControlName="source"
      [tuiTextfieldLabelOutside]="true">
      <tui-data-list-wrapper
        *tuiDataList
        [size]="size"
        [items]="list"
        [itemContent]="contentSource">
      </tui-data-list-wrapper>
    </tui-select>
  </label>
  <div class="form__control label">
    <span class="label__text">
      Токен
    </span>
    <div tuiGroup class="label__action">
      <button
        *ngIf="controlToken.value === null; else buttonCheck"
        [size]="size"
        class="filter__token-action"
        tuiButton
        iconEnd="@tui.plus"
        appearance="secondary"
        [disabled]="isDisabledToken$ | async"
        (click)="addToken($event)"
        type="button">
        <span>Добавить токен</span>
      </button>
      <button
        class="filter__token-remove"
        [size]="size"
        tuiIconButton
        iconEnd="@tui.x"
        appearance="secondary"
        [disabled]="isDisabledRemoveToken$ | async"
        (click)="removeToken($event)"
        type="button">
      </button>
    </div>
  </div>
</form>


<ng-template #contentSource let-item>
  {{ item.name }}
</ng-template>

<ng-template #load>
  <ui-loader></ui-loader>
</ng-template>

<ng-template #buttonCheck>
  <button
    [size]="size"
    class="filter__token-action"
    tuiButton
    iconEnd="@tui.check"
    appearance="positive"
    (click)="addToken($event)"
    type="button">
    <span>{{ controlToken.value.name }}</span>
  </button>
</ng-template>
