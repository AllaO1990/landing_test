<div class="dialog" [formGroup]="formGroup">
  <div class="dialog__title">
    <h3 *ngIf="typeTitle === 'add'; else titleChange">Добавить токен</h3>
  </div>
  <div class="dialog__container form">
    <label class="form__control">
      <span>Источник</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          placeholder="Источник"
          tuiTextfield
          formControlName="source"
        />
      </tui-textfield>
    </label>

    <label class="form__control">
      <span>Название</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          placeholder="Название"
          tuiTextfield
          formControlName="name"
        />
      </tui-textfield>
    </label>

    <label class="form__control">
      <span>Токен</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          tuiAutoFocus
          placeholder="Токен"
          tuiTextfield
          formControlName="token"
        />
      </tui-textfield>
    </label>
  </div>
  <div class="dialog__actions">
    <div class="space"></div>
    <button
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      [size]="size"
      tuiButton
      appearance="primary"
      type="button"
      [disabled]="formGroup.invalid"
      (click)="onSave($event)">
      Сохранить
    </button>
  </div>
</div>

<ng-template #titleChange>
  <h3>Изменить токен</h3>
</ng-template>
