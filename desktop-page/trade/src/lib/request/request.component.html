<div class="dialog" [formGroup]="formGroup">
  <div class="dialog__title">
    <h3>Заявка</h3>
  </div>
  <div class="dialog__container form">
    <div class="form__control">
      @if (actions$ | async; as items) {
        <span>Действия</span>
        <tui-textfield
          class="form__control"
          tuiChevron
          [stringify]="stringifyActions(items)"
          [tuiTextfieldSize]="size"
          [tuiTextfieldCleaner]="false">
          <input
            formControlName="direction"
            placeholder="Действия"
            autocomplete="off"
            tuiSelect />

          <tui-data-list
            *tuiTextfieldDropdown
            tuiDataListDropdownManager>
            <button
              *ngFor="let item of items"
              tuiOption
              new
              type="button"
              [value]="item.id">
              {{ item.name }}
            </button>
          </tui-data-list>

        </tui-textfield>
      }
    </div>

    <div class="form__control">
      @if (types$ | async; as items) {
        <span>Тип заявки</span>

        <tui-textfield
          class="form__control"
          tuiChevron
          [stringify]="stringifyTypes(items)"
          [tuiTextfieldSize]="size"
          [tuiTextfieldCleaner]="false">
          <input
            formControlName="orderType"
            placeholder="Тип заявки"
            autocomplete="off"
            tuiSelect />

          <tui-data-list
            *tuiTextfieldDropdown
            tuiDataListDropdownManager>
            <button
              *ngFor="let item of items"
              tuiOption
              new
              type="button"
              [value]="item.id">
              {{ item.name }}
            </button>
          </tui-data-list>

        </tui-textfield>
      }
    </div>

    <div class="form__control">
      <span>Цена</span>
      <tui-textfield
        [tuiTextfieldSize]="size">
        <input
          placeholder="Цена"
          tuiInputNumber
          formControlName="price"
        />
      </tui-textfield>
    </div>

    <div class="form__control">
      <span>Лоты</span>
      <tui-textfield
        [tuiTextfieldSize]="size"
        class="form__control">
        <input
          placeholder="Лоты"
          tuiInputNumber
          formControlName="lots"
          [max]="max"
        />
        @if (controlLot.value; as value) {
          <span>1 лот: {{ value }} шт.</span>
        }
      </tui-textfield>
    </div>

    <div class="form__control">
      <span>Количество</span>
      <tui-textfield
        [tuiTextfieldSize]="size"
        class="form__control">
        <input
          placeholder="Количество"
          tuiInputNumber
          formControlName="quantity"
          [max]="max"
        />
      </tui-textfield>
    </div>
  </div>
  <div class="dialog__actions">
    <div class="space"></div>
    <button
      [size]="size"
      tuiButton
      appearance="secondary"
      type="button"
      (click)="onCancel($event)">
      Отменить
    </button>
    <button
      [size]="size"
      tuiButton
      appearance="primary"
      type="button"
      [disabled]="formGroup.invalid"
      (click)="onSave($event)">
      Сохранить
    </button>
  </div>
</div>
