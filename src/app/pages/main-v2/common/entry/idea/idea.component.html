<div class="idea">
  <div class="idea__col">{{data.id}}</div>
  <div class="idea__col">{{data.direction}}</div>
  <div class="idea__col">{{data.ticker}}</div>
  <div class="idea__col">{{data.cost}}</div>
  <div class="idea__col">{{data.enter}}</div>
  <div class="idea__col">{{data.stop}}</div>
  <div class="idea__col">{{data.luck}}</div>
  <div class="idea__col idea__col--center">
    <img class="idea__icon" *ngIf="data.idea" src="/assets/icons/vanya.svg">
  </div>
</div>
