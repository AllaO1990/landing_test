<mat-card class="gpn-auth-card">
  <mat-card-header>
    <mat-card-title>Аутхоризатион</mat-card-title>
  </mat-card-header>
  <mat-card-content class="gpn-auth-card-content">
    <mat-form-field class="example-full-width">
      <input matInput placeholder="Введите наме" />
    </mat-form-field>
    <mat-form-field class="example-full-width">
      <input matInput placeholder="Введите пассворд" type="password" />
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-button (click)="login()">Логин</button>
  </mat-card-actions>
</mat-card>
